badge{display:grid;place-items:center;background:#f2e6d2;color:#a77737;width:35px;height:35px;flex:none;border-radius:12px;font-size:13px;font-weight:800}.topic-body{min-width:0;flex:1}.topic-body h2{font-size:16px;line-height:1.5;margin:0 0 5px;font-weight:800}.topic-body p{font-size:12px;color:var(--muted);margin:0;line-height:1.7}.topic-bottom{display:flex;justify-content:space-between;align-items:center;margin:13px 0 0;border-top:1px solid #eee8dd;padding-top:10px;color:#9e7844;font-size:11px;font-weight:700}.detail{background:var(--paper);border-radius:22px;border:1px solid var(--line);padding:22px 21px;box-shadow:var(--shadow);margin-top:10px}.detail-num{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.15em}.detail h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:25px;line-height:1.48;margin:10px 0 14px}.detail .rule{height:1px;background:linear-gradient(to right,var(--gold),transparent);margin-bottom:17px}.detail p{font-size:15px;line-height:2.08;letter-spacing:.025em;margin:0 0 14px}.detail .verse{background:#f8f3e8;padding:12px 14px;border-radius:12px;color:#795e38;font-size:12px;line-height:1.7;margin-top:15px}.detail-navigation{display:flex;gap:9px;margin-top:17px}.detail-navigation button{flex:1;border:1px solid var(--line);background:#fffdfa;border-radius:13px;padding:11px 6px;color:#4b605e;font-size:12px;font-weight:700;cursor:pointer}.detail-navigation .next{background:var(--navy);border-color:var(--navy);color:#fff}.detail-navigation button:disabled{opacity:.35;cursor:default}.helper{font-size:12px;color:#84908d;text-align:center;margin:18px 0}.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:700px){body{padding:22px}.shell{border-radius:24px;min-height:calc(100dvh - 44px)}.top{border-radius:24px 24px 0 0}}@media(max-width:350px){.hero h1{font-size:24px}.nav button{padding:6px 9px;font-size:11px}.view{padding-left:14px;p <body>
<div class="shell">
<header class="top"><div class="topline"><span class="brand">歸 家 · THE WAY HOME</span><span class="chap">路加福音 15:11–32</span></div><nav class="nav" aria-label="主要導覽" id="nav"></nav></header>

<script>
const sections=[
{id:'author',label:'作者介紹',icon:'✦',subtitle:'認識路加與他的福音敘事',intro:'三個線索，讀懂這個故事為何被記錄。',items:[
{title:'身分背景',preview:'從一位細心記錄者的眼光，理解耶穌的故事。',text:'《路加福音》的作者傳統上被認為是路加。他是使徒保羅的同工，並在《歌羅西書》中被稱為「親愛的醫生」（歌羅西書4章14節）。他善於蒐集見證、整理事件，以細膩而有條理的敘事，描繪耶穌如何關懷貧窮人、罪人與被忽略的人。',verse:'參考：路加福音1章1–4節；歌羅西書4章14節'},
{title:'寫作對象',preview:'寫給提阿非羅，也邀請每位尋找真理的人閱讀。',text:'路加開篇明確寫給「提阿非羅大人」，希望他知道自己所領受教導的確實性。這卷福音書也讓更廣泛的讀者，尤其是希臘羅馬世界中的外邦人，看見耶穌的救恩如何跨越社會、族群和身分的界線。',verse:'參考：路加福音1章3–4節'},
{title:'寫作目的',preview:'不只是交代事實，更要讓人看見救恩的心腸。',text:'路加盼望讀者透過有次序的記述，確信關於耶穌的教導真實可靠。全書特別凸顯上帝主動尋找失喪者、憐憫弱勢者的心意；從耶穌的言行直到祂的受死與復活，呈現那臨到萬民的救恩。',verse:'參考：路加福音1章1–4節；19章10節'}]},
{id:'summary',label:'內容摘要',icon:'☼',subtitle:'從離家、歸家，到心中的距離',intro:'三幕劇：自由的代價、恩典的擁抱，以及守規矩的迷失。',items:[
{title:'自由的代價：離開父親，才發現一無所有',preview:'亮點 × 痛點｜小兒子把自由當成逃跑的門票。',text:'小兒子提前要求分得家產，去了遠方，任意放蕩，最後落到挨餓、放豬的境地。他本以為離開父親便能自由自在，結果連豬吃的豆莢都令他羨慕。這段反差像一面鏡子：若只想擺脫關係與責任，自由也可能成為另一種困境。正是在最低谷，他「醒悟過來」，第一次真正看清自己的光景。',verse:'路加福音15章11–19節'},
{title:'愛的逆轉：還沒說完，父親已經擁抱',preview:'癢點 × 爽點｜最好的重逢，竟然不必先通過面試。',text:'小兒子決定回家，原打算請父親把自己當作雇工。但他相離還遠，父親已經看見他，動了慈心，跑去擁抱、親吻他；之後又吩咐僕人拿袍子、戒指和鞋，擺設筵席。父親不是說錯誤不重要，而是用接納迎接悔改的人，恢復他兒子的身分。原來，回家的路不是靠表現買回愛，而是被愛帶回生命。',verse:'路加福音15章20–24節'},
{title:'最大的反轉：人沒離家，心卻在門外',preview:'燃點 × 爆點｜最令人意外的迷路者，是乖兒子。',text:'故事尚未結束。大兒子看到弟弟受到歡迎，生氣到不肯進門，甚至把自己多年的服事當成交換獎賞的帳本。父親同樣走出來勸他，說：「我一切所有的都是你的。」小兒子迷失在遠方，大兒子卻迷失在比較和委屈裡。兩個人都需要重新理解父親的愛；令人震撼的是，父親願意走向兩個兒子。',verse:'路加福音15章25–32節'}]},
{id:'viewpoint',label:'個人觀點',icon:'♡',subtitle:'把這個故事讀進自己的心裡',intro:'三個反思，從故事人物轉向今日的自己。',items:[
{title:'人生最貴的學費，叫作任性！',preview:'我相信：成長不是不跌倒，而是懂得轉身。',text:'我相信，上帝賜人選擇的自由，卻不保證每個選擇都不付代價。小兒子的遭遇讓我看到，錯誤固然讓人狼狽，卻也可能成為醒悟的起點。我不認同把「做自己」當成不顧後果的藉口；成熟不是嘴硬到底，而是承認走錯路，願意踏上歸途。',verse:'回應：路加福音15章17–19節'},
{title:'你還在排練道歉，父親已衝出家門！',preview:'我喜歡：恩典先伸出手，悔改才有勇氣繼續。',text:'我最喜歡父親遠遠跑向兒子的畫面。他沒有拿著一張「不孝紀錄表」，逐項核對才准兒子進門。我也反對把接納誤解為縱容：兒子真實地醒悟並承認得罪父親，父親則以深厚的愛恢復關係。我認為，恩典不是把錯當對，而是讓人不必永遠困在錯誤裡。',verse:'回應：路加福音15章20–24節'},
{title:'最可怕的迷失，是以為自己從沒迷失！',preview:'我推論：守規矩若沒有愛，也會把人困在門外。',text:'我原先容易把大兒子看成受委屈的好人，但再讀才發現：他雖然沒有離家，心裡卻把與父親的關係變成計功論賞。我懷疑，當我們常用「我做了多少」衡量自己的價值時，也容易嫉妒別人得到憐憫。我的結論是：真正的信仰不只在行為正確，更在於能否與天父一同為失而復得的人歡喜。',verse:'回應：路加福音15章25–32節'}]},
{id:'practice',label:'生活應用',icon:'↟',subtitle:'把「回家」變成今天的行動',intro:'從自我修復、接納他人，到放下比較。',items:[
{title:'勇敢回頭：失敗不是終點',preview:'面對過錯，停下逃避，採取第一步修復。',text:'今天就選一件自己一直逃避的事，誠實承認問題；若傷害了人，主動道歉，並提出一項可執行的補救行動。悔改不是只感到內疚，而是願意改變方向。回家，不需要等到自己變得毫無缺點。',verse:'行動練習：寫下「我要修復的一件事」'},
{title:'學習擁抱：先理解，再談改變',preview:'別讓責備，搶先說完愛原本想說的話。',text:'當家人、朋友犯錯時，先耐心傾聽他的難處，清楚表達「我願意陪你面對」，再一起討論界線與解決方式。接納不等於取消責任，而是讓對方知道：犯錯的人仍然值得被尊重，也有機會重新開始。',verse:'行動練習：本週主動關心一位需要鼓勵的人'},
{title:'拆掉高牆：少計較，多一點歡喜',preview:'停止比較，重新練習為別人的好消息開心。',text:'當心裡冒出「憑什麼他可以？」時，先問自己：我是不是正在把愛當成一場競賽？練習為他人的進步或被接納獻上祝福，也檢視自己是否用表現換取價值感。願我不只住在父親家裡，也真正擁有父親的心。',verse:'行動練習：真心稱讚一位自己曾經比較的人'}]}
];
const nav=document.getElementById('nav'),main=document.getElementById('main');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function url(section='',item=''){return '#/'+[section,item].filter(Boolean).join('/')}
function go(section='',item=''){location.hash=url(section,item);if(location.hash===url(section,item))render()}
function route(){let p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/').filter(Boolean);return {section:sections.find(s=>s.id===p[0]),index:p[1]===undefined?null:Number(p[1])}}
function drawNav(active){nav.innerHTML=[{id:'',label:'⌂ 首頁'},...sections].map(s=>`<button type="button" class="${active===s.id?'active':''}" data-go="${s.id}" ${active===s.id?'aria-current="page"':''}>${s.label}</button>`).join('')}
function illustration(){return `<svg viewBox="0 0 430 150" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fae4ab"/><stop offset="1" stop-color="#d2a75e"/></linearGradient></defs><circle cx="305" cy="57" r="49" fill="url(#sun)" opacity=".95"/><path d="M0 125Q80 75 170 122T430 100V150H0Z" fill="#829387" opacity=".52"/><path d="M0 142Q110 110 185 137T430 115V150H0Z" fill="#142e35" opacity=".8"/><path d="M216 150 Q250 113 303 98 Q336 88 359 88" fill="none" stroke="#e0c48b" stroke-width="4" stroke-dasharray="8 10" opacity=".8"/><g fill="#1b343d"><circle cx="324" cy="66" r="9"/><path d="M315 77Q326 72 333 80L341 111H312Z"/><path d="M316 103L308 139H316L326 110L337 139H346L336 99Z"/><path d="M318 81L300 99L295 94L315 73Z"/><circle cx="286" cy="85" r="7"/><path d="M278 93Q286 90 292 94L301 117H273Z"/><path d="M279 113L274 140H281L288 117L296 140H303L295 111Z"/><path d="M293 96L306 87L312 92L299 104Z"/></g><path d="M316 87Q309 79 297 91" fill="none" stroke="#1b343d" stroke-width="7" stroke-linecap="round"/></svg>`}
function home(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">THE PRODIGAL SON · 靈修閱讀</div><h1>一個離家，<br>一個離心：<br>父親竟然都在等！</h1><p>兩個兒子，兩種迷失；同一位父親，始終敞開的愛。</p></div>${illustration()}</section><div class="mini">EXPLORE THE STORY　·　選擇閱讀章節</div><section class="home-grid" aria-label="閱讀章節">${sections.map((s,i)=>`<button type="button" class="home-card" data-go="${s.id}"><div class="num">0${i+1} / CHAPTER</div><div class="symbol" aria-hidden="true">${s.icon}</div><h2>${s.label}</h2><p>${s.subtitle}</p><span class="go" aria-hidden="true">↗</span></button>`).join('')}</section><blockquote class="quote">「這個兒子是死而復活，失而又得的。」<br><small>— 路加福音15章24節</small></blockquote><p class="foot">✦ 點選章節，再點選主題，即可展開完整心得 ✦</p>`}
function sectionPage(s){let i=sections.indexOf(s);return `<button class="back" data-go="">← 回首頁</button><div class="sect-intro"><div class="sect-kicker">CHAPTER 0${i+1} / 04</div><h1>${s.label}</h1><p>${s.intro}</p></div><div class="track" aria-hidden="true">${sections.map((_,j)=>`<span class="${j<=i?'on':''}"></span>`).join('')}</div><div class="topic-stack">${s.items.map((x,j)=>`<button type="button" class="topic-card" data-item="${j}"><div class="topic-head"><span class="topic-badge">0${j+1}</span><div class="topic-body"><h2>${escapeHtml(x.title)}</h2><p>${escapeHtml(x.preview)}</p></div></div><div class="topic-bottom"><span>閱讀完整內容</span><span>展開 ↗</span></div></button>`).join('')}</div><p class="helper">共 3 個主題 · 點擊卡片深入閱讀</p>`}
function detailPage(s,i){let item=s.items[i];return `<button class="back" data-go="${s.id}">← 返回${s.label}</button><article class="detail"><div class="detail-num">${s.label} · 0${i+1} / 03</div><h1>${escapeHtml(item.title)}</h1><div class="rule"></div><p>${escapeHtml(item.text)}</p><div class="verse">✦ ${escapeHtml(item.verse)}</div></article><div class="detail-navigation"><button ${i===0?'disabled':''} data-item="${i-1}">← 上一篇</button><button data-go="${s.id}">全部主題</button><button class="next" ${i===s.items.length-1?'disabled':''} data-item="${i+1}">下一篇 →</button></div>`}
function render(){const r=route();document.title=(r.section?r.section.label+'｜':'')+'一個離家，一個離心｜路加福音15章';drawNav(r.section?r.section.id:'');main.innerHTML=!r.section?home():r.index!==null&&Number.isInteger(r.index)&&r.index>=0&&r.index<r.section.items.length?detailPage(r.section,r.index):sectionPage(r.section);window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const btn=e.target.closest('button[data-go],button[data-item]');if(!btn)return;if(btn.hasAttribute('data-go'))go(btn.dataset.go);else{let s=route().section;if(s)go(s.id,btn.dataset.item)}});window.addEventListener('hashchange',render);render();
</script>

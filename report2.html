  <!-- ===============================

  <!-- ===============================
       資料與直式交互邏輯
  ================================ -->
  <script>
    const appData = {

          {

          {
            id: 'sum-weight',
            tag: '重量',
            title: '自以為義的盲點與呼喚',
            brief: '「兒啊！你常和我同在，我一切所有的都是你的；只是你這個兄弟是死而復活的...」',
            detail: '故事的高潮在於父親步出家門勸慰長子。大兒子恪守規矩，心態卻是計較功勞與羔羊的「僱工」。他視同胞為外人，將父子同在當作服役。父親溫柔提醒：愛的本質是共享，而非功過記帳。',

      perspective: {
        id: 'perspective',
        title: '個人觀點',

        shortDesc: '跳脫刻板道德審判，重新審視恩典的本質與家的真諦。',

          {

            title: '家的本質是共享的接納',

            title: '跨越偏見，同理邊緣群體',

            detail: '社群中容易形成冷漠鄙視鏈。我們應刻意破除偏見同溫層，不拿道德成就自誇，而是主動為處於生活低谷、犯過錯或弱勢的群體伸出雙手，給予尊嚴與重回常軌的支持。',

    let appState = {
      view: 'home', // 'home' | 'section'
      currentSectionId: null,
      expandedItemId: null // 次頁面內手風琴展開的項目 ID
    };

    function navigateTo(view, sectionId = null, defaultExpandId = null) {
      appState.view = view;
      appState.currentSectionId = sectionId;
      appState.expandedItemId = defaultExpandId;

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
      updateTabs();
    }

    function toggleAccordion(itemId) {
      if (appState.expandedItemId === itemId) {
        appState.expandedItemId = null; // 收合
      } else {
        appState.expandedItemId = itemId; // 展開
      }
      renderApp();
    }

    function updateTabs() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(t => t.classList.remove('active-pill'));

      const activeId = appState.view === 'home' ? 'tab-home' : `tab-${appState.currentSectionId}`;
      const activeEl = document.getElementById(activeId);
      if (activeEl) {
        activeEl.classList.add('active-pill');
        activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (appState.view === 'home') {
        root.innerHTML = renderHomeView();
      } else {
        root.innerHTML = renderSectionView(appState.currentSectionId);
      }
    }

    // ==========================================
    // 1. 直式專屬「2x2 四宮格」首頁 (免滑動單屏盡覽)
    // ==========================================
    function renderHomeView() {
      const sections = ['author', 'summary', 'perspective', 'application'];
      
      const gridCards = sections.map((secKey, index) => {
        const sec = appData[secKey];
        return `
          <div onclick="navigateTo('section', '${sec.id}')"
               class="active:scale-95 transition-transform bg-white border border-amber-900/10 rounded-2xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md cursor-pointer relative overflow-hidden">
            <div class="space-y-1">
              <div class="flex items-center justify-between">
                <span class="text-xl">${sec.icon}</span>
                <span class="text-[10px] font-bold font-cinzel text-amber-800 bg-amber-100/70 px-2 py-0.5 rounded-full">
                  0${index + 1}
                </span>
              </div>
              <h2 class="text-base font-bold text-stone-900 pt-1">
                ${sec.title}
              </h2>
              <p class="text-[11px] text-stone-500 line-clamp-2 leading-relaxed">
                ${sec.shortDesc}
              </p>
            </div>
            
            <div class="pt-3 flex items-center justify-between text-[11px] font-semibold text-amber-800">
              <span>3 項細節</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
              </svg>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-3.5">
          <!-- 緊湊型標題 -->
          <div class="bg-gradient-to-r from-amber-900 to-stone-900 text-white rounded-2xl p-4 shadow-sm relative overflow-hidden">
            <div class="relative z-10 space-y-1">
              <span class="text-[10px] uppercase tracking-wider text-amber-300 font-cinzel font-semibold">Study & Reflection</span>
              <h1 class="text-lg font-black tracking-tight">浪子回頭：恩典與自義之鏡</h1>
              <p class="text-xs text-stone-300 leading-snug">路加福音 15:11-32 · 點選下方選單展開互動鑽研</p>
            </div>
            <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-amber-500/10 rounded-full blur-xl pointer-events-none"></div>
          </div>

          <!-- 2x2 精緻選單網格 -->
          <div class="grid grid-cols-2 gap-2.5">
            ${gridCards}
          </div>

          <!-- 經文精句 (微型字卡) -->
          <div class="bg-amber-50/80 border border-amber-800/15 rounded-xl p-3 flex items-start gap-2.5">
            <span class="text-amber-800 text-sm mt-0.5">✦</span>
            <div>
              <p class="text-xs text-stone-800 font-serif italic leading-relaxed">
                「相離還遠，他父親看見，就動了慈心，跑去抱著他的頸項，連連與他親嘴。」
              </p>
              <span class="text-[10px] text-stone-500 mt-0.5 block">— 路加福音 15:20</span>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 2. 次頁面：在同一畫面直接點擊手風琴展開完整內容
    // ==========================================
    function renderSectionView(sectionId) {
      const sec = appData[sectionId];
      if (!sec) return '<div class="text-center py-6 text-sm">無內容</div>';

      const itemsHtml = sec.items.map((item, index) => {
        const isExpanded = appState.expandedItemId === item.id;

        return `
          <div class="bg-white border ${isExpanded ? 'border-amber-700 shadow-md ring-1 ring-amber-700/20' : 'border-stone-200 shadow-sm'} rounded-xl overflow-hidden transition-all duration-200">
            
            <!-- 標題點擊按鈕 -->
            <button onclick="toggleAccordion('${item.id}')"
                    class="w-full text-left p-3.5 flex items-center justify-between gap-3 focus:outline-none">
              <div class="flex items-center gap-2.5 flex-1 min-w-0">
                <span class="w-6 h-6 rounded-full ${isExpanded ? 'bg-amber-800 text-white' : 'bg-stone-100 text-stone-600'} text-xs font-bold flex items-center justify-center shrink-0">
                  0${index + 1}
                </span>
                <div class="truncate">
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-amber-50 text-amber-800 shrink-0">${item.tag}</span>
                    <h3 class="text-sm font-bold text-stone-900 truncate">${item.title}</h3>
                  </div>
                  <p class="text-xs text-stone-500 truncate mt-0.5">${item.brief}</p>
                </div>
              </div>

              <!-- 箭頭圖示 -->
              <div class="w-6 h-6 rounded-full bg-stone-100 flex items-center justify-center shrink-0 text-stone-600 transition-transform duration-200 ${isExpanded ? 'rotate-180 bg-amber-100 text-amber-900' : ''}">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                </svg>
              </div>
            </button>

            <!-- 展開之完整內容容器 (直式專用緊湊排版) -->
            ${isExpanded ? `
              <div class="border-t border-amber-900/10 bg-[#FCFAF7] p-3.5 space-y-3 animate-fadeIn text-xs">
                
                <!-- 經文卡片 -->
                ${item.scriptureRef ? `
                  <div class="bg-amber-50 border-l-2 border-amber-700 p-2.5 rounded text-stone-800 font-serif italic text-xs leading-relaxed">
                    ${item.scriptureRef}
                  </div>
                ` : ''}

                <!-- 詳細文字 -->
                <div class="text-stone-800 text-xs font-serif leading-relaxed space-y-2">
                  <p>${item.detail}</p>
                </div>

                <!-- 核心啟發 -->
                ${item.insight ? `
                  <div class="bg-white border border-stone-200 rounded-lg p-2.5 flex items-start gap-2">
                    <span class="text-amber-800 text-xs shrink-0 mt-0.5">💡</span>
                    <p class="text-stone-600 text-[11px] leading-relaxed">
                      <strong class="text-stone-900">核心提煉：</strong>${item.insight}
                    </p>
                  </div>
                ` : ''}

                <!-- 快速收合按鈕 -->
                <div class="text-right pt-1">
                  <button onclick="toggleAccordion('${item.id}')" class="text-[11px] text-amber-800 font-semibold hover:underline">
                    收合本項 ▲
                  </button>
                </div>

              </div>
            ` : ''}

          </div>
        `;
      }).join('');

      return `
        <div class="space-y-3">
          <!-- 頂部資訊條 -->
          <div class="flex items-center justify-between pb-1">
            <div class="flex items-center gap-1.5">
              <span class="text-lg">${sec.icon}</span>
              <h2 class="text-base font-black text-stone-900">${sec.title}</h2>
              <span class="text-xs text-stone-500">（共 3 項）</span>
            </div>
            <button onclick="navigateTo('home')" class="text-xs text-amber-800 font-semibold bg-stone-100 px-2 py-1 rounded-md">
              回首頁
            </button>
          </div>

          <p class="text-xs text-stone-600 leading-snug">
            ${sec.shortDesc} 點擊任一項目即可直接在此展開閱讀完整解析。
          </p>

          <!-- 項目手風琴清單 -->
          <div class="space-y-2.5 pt-1">
            ${itemsHtml}
          </div>
        </div>
      `;
    }

    // 初始化
    window.onload = function() {
      renderApp();
      updateTabs();
    };
  </script>
</body>
</html>

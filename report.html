        subtitle: 'PRACTICAL ACTION IN DAILY LIFE',
        desc: '將兩千年前的寓言化為現代生活中的關係修復指南，涵蓋家庭、職場自省與社會關懷。',
        badge: '第四部分',
        icon: `<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
        items: [
          {
            id: 'app-reconcile',
            tag: '關係重建',
            title: '放下計較，修復親密關係',
            brief: '面對家人或夥伴的過失，停止算計與情緒勒索，以主動理解創造重修舊好的契機。',
            detail: `在家庭或職場團隊中，我們往往像大兒子一樣牢記著「我付出了多少，對方欠我多少」，用沉默的冷暴力或指責築起隔閡。實踐應用的第一步：在發生衝突或他人向我們示弱時，主動跨出第一步（正如父親步出家門），以「對人的在乎」壓過「對對錯的執念」，給予對方體面的台階，讓關係有重新呼吸的空間。`,
            scriptureRef: '以弗所書 4:32：「並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」',
            insight: '主動走向對方並非認輸，而是將關係的價值置於個人虛榮之上的高貴展現。'
          },
          {
            id: 'app-honesty',
            tag: '自我超越',
            title: '自我坦誠，勇敢面對失敗',
            brief: '當生活陷入泥淖或走錯方向時，卸下防衛與藉口，誠實面對脆弱並及時回轉。',
            detail: `現代人常因面子與自尊，在陷入生活挫敗、成癮或錯誤決策時，寧可像小兒子在豬圈挨餓，也不肯承認自己需要幫助。生活應用的第二步：學會「醒悟過來」（路 15:17），誠實向自己與信任的同伴承認：「我無能為力，我迷失了方向。」唯有承認脆弱，恩典的力量才能介入，引導我們重獲秩序。`,
            scriptureRef: '路加福音 15:17：「他醒悟過來，就說：我父親有多少的雇工，口糧有餘，我倒在這裡餓死嗎？」',
            insight: '回頭的第一步不是自責懊惱，而是看清事實並相信：總有一扇門永遠為悔悟者敞開。'
          },
          {
            id: 'app-empathy',
            tag: '社會關懷',
            title: '跨越偏見，同理邊緣群體',
            brief: '拒絕以道德優越感審判他人，學習以溫暖目光接納社會低谷與失意者。',
            detail: `社會與社群中總充斥著無形的鄙視鏈，我們容易對犯錯者、更生人、弱勢或持不同立場者貼上標籤。生活應用的第三步：在教會、校園或社區中，刻意打破冷漠的同溫層，不將自我的道德幸運視為炫耀資本，而是主動為處於邊緣的人端上一杯熱水，提供實質支持與接納，成為他們回歸群體的同行者。`,
            scriptureRef: '彌迦書 6:8：「世人哪，耶和華已指示你何為善。他向你所要的是什麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。」',
            insight: '成熟的社會不在於有多嚴厲的懲戒，而是在於能為跌倒者提供多寬厚、有尊嚴的扶起之道。'
          }
        ]
      }
    };

    // 應用程式狀態
    let appState = {
      view: 'home', // 'home' | 'section' | 'item'
      currentSectionId: null,
      currentItemId: null
    };

    // 路由控制器
    function navigateTo(view, sectionId = null, itemId = null) {
      appState.view = view;
      appState.currentSectionId = sectionId;
      appState.currentItemId = itemId;

      // 滾動至頂部
      window.scrollTo({ top: 0, behavior: 'smooth' });

      renderApp();
      updateNavHighlight();
    }

    // 更新導覽列高亮按鈕
    function updateNavHighlight() {
      const navButtons = document.querySelectorAll('.nav-item');
      navButtons.forEach(btn => {
        btn.classList.remove('bg-amber-900', 'text-amber-50', 'shadow-sm');
        btn.classList.add('text-stone-700');
      });

      let targetBtnId = 'nav-btn-home';
      if (appState.view === 'home') {
        targetBtnId = 'nav-btn-home';
      } else if (appState.currentSectionId) {
        targetBtnId = `nav-btn-${appState.currentSectionId}`;
      }

      const activeBtn = document.getElementById(targetBtnId);
      if (activeBtn) {
        activeBtn.classList.remove('text-stone-700');
        activeBtn.classList.add('bg-amber-900', 'text-amber-50', 'shadow-sm');
      }
    }

    // 手機版選單開關
    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }

    // 主渲染分發器
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (appState.view === 'home') {
        root.innerHTML = renderHomeView();
      } else if (appState.view === 'section') {
        root.innerHTML = renderSectionView(appState.currentSectionId);
      } else if (appState.view === 'item') {
        root.innerHTML = renderItemDetailView(appState.currentSectionId, appState.currentItemId);
      }
    }

    // ==========================================
    // 1. 首頁視圖 (Home View)
    // ==========================================
    function renderHomeView() {
      const sections = ['author', 'summary', 'perspective', 'application'];
      
      const cardsHtml = sections.map((secKey, index) => {
        const sec = appData[secKey];
        return `
          <div onclick="navigateTo('section', '${sec.id}')" 
               class="card-hover-effect cursor-pointer group bg-white/80 border border-stone-200/80 rounded-2xl p-6 sm:p-8 flex flex-col justify-between relative overflow-hidden shadow-sm hover:border-amber-400/80 transition-all">
            
            <!-- 裝飾背景漸變 -->
            <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-amber-100/40 group-hover:bg-amber-200/50 transition-colors blur-xl pointer-events-none"></div>
            
            <div>
              <div class="flex items-center justify-between mb-4">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold tracking-wider font-cinzel text-amber-800 bg-amber-100/80">
                  ${sec.badge}
                </span>
                <span class="w-12 h-12 rounded-xl bg-amber-50 text-amber-800 flex items-center justify-center group-hover:bg-amber-700 group-hover:text-white transition-all shadow-inner">
                  ${sec.icon}
                </span>
              </div>

              <h2 class="text-2xl font-bold text-stone-900 mb-2 group-hover:text-amber-900 transition-colors">
                ${sec.title}
              </h2>
              <p class="text-xs font-cinzel font-semibold tracking-wider text-amber-700/80 mb-3 uppercase">
                ${sec.subtitle}
              </p>
              <p class="text-stone-600 text-sm leading-relaxed mb-6">
                ${sec.desc}
              </p>
            </div>

            <div class="pt-4 border-t border-stone-100 flex items-center justify-between text-sm font-semibold text-amber-900 group-hover:text-amber-700">
              <span class="flex items-center gap-1.5">
                探索 3 個重點維度
              </span>
              <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-stone-100 group-hover:bg-amber-100 group-hover:translate-x-1 transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 5l7 7-7 7"></path>
                </svg>
              </span>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="animate-fadeIn space-y-12">
          
          <!-- Hero 標頭區 -->
          <div class="text-center max-w-3xl mx-auto space-y-4 pt-4 sm:pt-8">
            <div class="inline-block px-4 py-1.5 rounded-full bg-amber-100/70 text-amber-900 text-xs sm:text-sm font-medium tracking-wide">
              聖經文學與神學反思報告
            </div>
            <h1 class="text-3xl sm:text-5xl font-black text-stone-900 tracking-tight leading-tight">
              浪子回頭 <span class="text-amber-800 font-cinzel font-medium text-2xl sm:text-4xl block sm:inline mt-1 sm:mt-0">| 恩典與心靈之鏡</span>
            </h1>
            <p class="text-stone-600 text-base sm:text-lg leading-relaxed pt-2">
              聚焦路加福音 15:11-32。透過作者意圖、經文骨幹、哲理反思與現代實踐四重維度，點擊下方選單展開互動鑽研。
            </p>
          </div>

          <!-- 四大主題精選卡片 (漂亮框框選單) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
            ${cardsHtml}
          </div>

          <!-- 底部經文名言裝飾區 -->
          <div class="rounded-2xl bg-gradient-to-r from-stone-900 to-amber-950 text-amber-50 p-6 sm:p-10 shadow-lg relative overflow-hidden">
            <div class="relative z-10 max-w-2xl">
              <span class="text-amber-400 font-cinzel text-xs font-semibold tracking-widest block mb-2">KEY SCRIPTURE</span>
              <blockquote class="text-lg sm:text-xl font-serif italic leading-relaxed text-stone-200">
                「相離還遠，他父親看見，就動了慈心，跑去抱著他的頸項，連連與他親嘴。」
              </blockquote>
              <p class="text-sm text-amber-300 mt-3 font-sans">— 路加福音 15:20</p>
            </div>
            <div class="absolute -right-10 -bottom-10 opacity-10">
              <svg class="w-64 h-64 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2zm0-10h2v8h-2z"/>
              </svg>
            </div>
          </div>

        </div>
      `;
    }

    // ==========================================
    // 2. 次頁面視圖 (Section View - 呈現內容簡介及3個項目清單)
    // ==========================================
    function renderSectionView(sectionId) {
      const sec = appData[sectionId];
      if (!sec) return '<div class="text-center py-12">內容不存在</div>';

      const itemsHtml = sec.items.map((item, index) => {
        return `
          <div onclick="navigateTo('item', '${sec.id}', '${item.id}')"
               class="card-hover-effect cursor-pointer group bg-white border border-stone-200 rounded-2xl p-6 sm:p-7 relative shadow-sm hover:border-amber-500/80 hover:bg-amber-50/20 transition-all flex flex-col md:flex-row md:items-center justify-between gap-6">
            
            <div class="flex-1 space-y-2">
              <div class="flex items-center gap-3">
                <span class="w-7 h-7 rounded-full bg-amber-100 text-amber-900 font-bold text-xs flex items-center justify-center font-sans">
                  0${index + 1}
                </span>
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded bg-stone-100 text-stone-700">
                  ${item.tag}
                </span>
              </div>
              <h3 class="text-xl font-bold text-stone-900 group-hover:text-amber-900 transition-colors">
                ${item.title}
              </h3>
              <p class="text-stone-600 text-sm leading-relaxed">
                ${item.brief}
              </p>
            </div>

            <div class="flex items-center gap-2 text-sm font-semibold text-amber-800 shrink-0 self-end md:self-center">
              <span>點擊閱讀全文</span>
              <div class="w-9 h-9 rounded-full bg-amber-100/60 text-amber-900 flex items-center justify-center group-hover:bg-amber-800 group-hover:text-white transition-all shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
              </div>
            </div>

          </div>
        `;
      }).join('');

      return `
        <div class="animate-fadeIn space-y-8">
          
          <!-- 麵包屑導航 -->
          <nav class="flex items-center text-sm text-stone-500 space-x-2">
            <button onclick="navigateTo('home')" class="hover:text-amber-800 transition-colors">首頁</button>
            <span>/</span>
            <span class="text-amber-900 font-semibold">${sec.title}</span>
          </nav>

          <!-- 區段標頭資訊 -->
          <div class="bg-gradient-to-br from-white via-amber-50/30 to-amber-100/20 border border-amber-900/10 rounded-2xl p-6 sm:p-10 shadow-sm relative overflow-hidden">
            <div class="max-w-3xl space-y-3">
              <span class="inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider font-cinzel text-amber-900 bg-amber-200/60">
                ${sec.badge}
              </span>
              <h1 class="text-3xl sm:text-4xl font-black text-stone-900">
                ${sec.title}
              </h1>
              <p class="text-stone-600 text-base leading-relaxed">
                ${sec.desc}
              </p>
            </div>
          </div>

          <!-- 子項目列表提示 -->
          <div class="flex items-center justify-between border-b border-stone-200 pb-3">
            <div class="text-sm font-semibold text-stone-700 flex items-center gap-2">
              <svg class="w-4 h-4 text-amber-700" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd"></path>
              </svg>
              請選擇下方項目以深入展開互動論述（共 3 項）
            </div>
            <button onclick="navigateTo('home')" class="text-xs text-amber-800 hover:underline">
              返回主題總覽
            </button>
          </div>

          <!-- 項目清單 -->
          <div class="space-y-4">
            ${itemsHtml}
          </div>

        </div>
      `;
    }

    // ==========================================
    // 3. 完整細節視圖 (Item Detail View - 點擊後看最完整內容)
    // ==========================================
    function renderItemDetailView(sectionId, itemId) {
      const sec = appData[sectionId];
      if (!sec) return '<div class="text-center py-12">內容不存在</div>';

      const itemIndex = sec.items.findIndex(it => it.id === itemId);
      const item = sec.items[itemIndex];
      if (!item) return '<div class="text-center py-12">項目不存在</div>';

      // 取得上一個與下一個項目 ID
      const prevItem = itemIndex > 0 ? sec.items[itemIndex - 1] : null;
      const nextItem = itemIndex < sec.items.length - 1 ? sec.items[itemIndex + 1] : null;

      return `
        <div class="animate-fadeIn max-w-4xl mx-auto space-y-8">
          
          <!-- 麵包屑導航 -->
          <div class="flex items-center justify-between">
            <nav class="flex items-center text-sm text-stone-500 space-x-2">
              <button onclick="navigateTo('home')" class="hover:text-amber-800 transition-colors">首頁</button>
              <span>/</span>
              <button onclick="navigateTo('section', '${sec.id}')" class="hover:text-amber-800 transition-colors">${sec.title}</button>
              <span>/</span>
              <span class="text-amber-900 font-semibold truncate max-w-[150px] sm:max-w-none">${item.tag}</span>
            </nav>
            <button onclick="navigateTo('section', '${sec.id}')" class="inline-flex items-center gap-1 text-sm font-medium text-amber-900 hover:text-amber-700 bg-amber-100/70 px-3 py-1.5 rounded-lg transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
              </svg>
              返回${sec.title}
            </button>
          </div>

          <!-- 完整詳情卡片 -->
          <article class="bg-white border border-stone-200/90 rounded-3xl p-6 sm:p-12 shadow-md space-y-8">
            
            <header class="space-y-3 border-b border-stone-100 pb-6">
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-900">
                  ${sec.title} · 核心項目 0${itemIndex + 1}
                </span>
                <span class="px-2.5 py-0.5 rounded text-xs bg-stone-100 text-stone-600 font-medium">
                  ${item.tag}
                </span>
              </div>
              <h1 class="text-2xl sm:text-4xl font-extrabold text-stone-900 tracking-tight leading-snug">
                ${item.title}
              </h1>
              <p class="text-stone-500 text-base italic">
                概要精煉：${item.brief}
              </p>
            </header>

            <!-- 經文引用盒 (若有) -->
            ${item.scriptureRef ? `
              <div class="rounded-2xl bg-amber-50/70 border-l-4 border-amber-700 p-5 sm:p-6 text-stone-800">
                <div class="text-xs font-bold text-amber-900 uppercase font-cinzel mb-1 tracking-wider">經文鑑賞與依據</div>
                <div class="font-serif text-base sm:text-lg italic leading-relaxed text-stone-900">
                  ${item.scriptureRef}
                </div>
              </div>
            ` : ''}

            <!-- 深度解析文章內文 -->
            <div class="space-y-4">
              <h2 class="text-xs font-bold tracking-widest text-stone-400 uppercase font-sans">
                DETAILED EXEGESIS & REFLECTION / 深度論述
              </h2>
              <div class="text-stone-800 text-base sm:text-lg leading-loose space-y-4 font-serif">
                <p>${item.detail}</p>
              </div>
            </div>

            <!-- 神學 / 生活靈光 (Insight Box) -->
            ${item.insight ? `
              <div class="bg-stone-50 rounded-2xl p-5 sm:p-6 border border-stone-200/60 flex items-start gap-4">
                <div class="w-10 h-10 rounded-xl bg-amber-700 text-white flex items-center justify-center shrink-0 mt-0.5">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                </div>
                <div>
                  <h4 class="font-bold text-stone-900 text-sm mb-1">精要提煉 (Takeaway)</h4>
                  <p class="text-stone-600 text-sm leading-relaxed">${item.insight}</p>
                </div>
              </div>
            ` : ''}

            <!-- 底部項目導引切換 -->
            <footer class="pt-8 border-t border-stone-200/80 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                ${prevItem ? `
                  <button onclick="navigateTo('item', '${sec.id}', '${prevItem.id}')" class="inline-flex items-center gap-2 text-stone-600 hover:text-amber-900 text-sm font-semibold group transition-colors">
                    <span class="p-2 rounded-lg bg-stone-100 group-hover:bg-amber-100">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                      </svg>
                    </span>
                    <span>上一項：${prevItem.tag}</span>
                  </button>
                ` : '<span class="text-stone-300 text-sm">已是本單元第一項</span>'}
              </div>

              <div>
                ${nextItem ? `
                  <button onclick="navigateTo('item', '${sec.id}', '${nextItem.id}')" class="inline-flex items-center gap-2 text-stone-600 hover:text-amber-900 text-sm font-semibold group transition-colors">
                    <span>下一項：${nextItem.tag}</span>
                    <span class="p-2 rounded-lg bg-stone-100 group-hover:bg-amber-100">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                      </svg>
                    </span>
                  </button>
                ` : `
                  <button onclick="navigateTo('home')" class="inline-flex items-center gap-1.5 text-sm font-bold text-amber-900 bg-amber-100 px-4 py-2 rounded-lg hover:bg-amber-200 transition-colors">
                    完成研讀，回主選單
                  </button>
                `}
              </div>
            </footer>

          </article>

        </div>
      `;
    }

    // 動畫淡入效果輔助類
    const styleEl = document.createElement('style');
    styleEl.innerHTML = `
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    `;
    document.head.appendChild(styleEl);

    // 初始化頁面
    window.onload = function() {
      renderApp();
      updateNavHighlight();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>屬靈全副軍裝 - 晨更宣告</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #080d21;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.9)) drop-shadow(0 0 16px rgba(234, 179, 8, 0.6)); }
      50% { filter: drop-shadow(0 0 16px rgba(250, 204, 21, 1)) drop-shadow(0 0 28px rgba(245, 158, 11, 0.85)); }
    }
    .gear-glow {
      animation: pulse-glow 2s infinite ease-in-out;
    }
    .gear-item {
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .gear-dim {
      opacity: 0.38;
      filter: grayscale(88%) brightness(0.65);
    }
    .gear-active {
      opacity: 1;
      filter: grayscale(0%) brightness(1.1);
      transform: scale(1.02);
    }
    .touch-target {
      position: absolute;
      z-index: 25;
      border-radius: 9999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(251, 191, 36, 0.5);
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex justify-center p-0">

  <!-- 隱藏音訊播放組件 -->
  <audio id="ttsAudioPlayer" class="hidden" playsinline preload="auto"></audio>

  <!-- 手機主容器：移除 justify-between，緊密向上靠攏 -->
  <div class="relative w-full max-w-[430px] min-h-screen bg-gradient-to-b from-[#080d21] via-[#0d1b3a] to-[#0a1128] sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-start border-x border-amber-500/20 sm:border pb-6">

    <!-- 背景星芒 Canvas -->
    <canvas id="bgCanvas" class="absolute inset-0 pointer-events-none z-0"></canvas>

    <!-- ==================== 1. 頂部資訊列 ==================== -->
    <header class="relative z-20 px-3 py-2 flex items-center justify-between border-b border-amber-400/20 bg-slate-950/85 backdrop-blur-md shrink-0">
      <div class="flex items-center gap-1.5">
        <button onclick="openNameModal()" class="flex items-center gap-1 px-3 py-1 rounded-full bg-gradient-to-r from-amber-500/20 to-yellow-500/20 border border-amber-400/40 text-amber-200 active:scale-95 transition-all">
          <span class="text-base">🛡️</span>
          <span id="playerDisplayName" class="font-bold text-sm tracking-wide text-amber-100">神國勇士</span>
          <svg class="w-3 h-3 text-amber-400 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
        </button>
        <span id="headerDate" class="text-xs text-slate-300 font-semibold tracking-tight"></span>
      </div>

      <div class="flex items-center gap-1.5">
        <div class="px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700 text-amber-300 text-xs font-bold">
          <span id="progressText">進度 0 / 6</span>
        </div>
        <button id="ttsToggleBtn" onclick="toggleTtsSetting()" class="p-1.5 rounded-lg bg-slate-800/80 border border-slate-700 text-amber-300 text-sm active:scale-95 transition-all" title="語音朗讀開關">
          🔊
        </button>
        <button onclick="toggleCalendarModal(true)" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-amber-500/20 border border-amber-400/30 text-amber-200 text-xs font-bold active:scale-95 transition-all">
          <span>📅</span>
          <span>本月核取曆</span>
        </button>
      </div>
    </header>

    <!-- 引導標籤 (緊貼頂部) -->
    <div class="relative z-10 text-center pt-2 pb-1 shrink-0">
      <span class="inline-flex items-center gap-1 px-3.5 py-1 rounded-full bg-slate-900/85 border border-amber-400/35 text-amber-200 text-xs tracking-wide shadow-sm">
        👉 點選裝備，朗讀並宣告今日得勝金句
      </span>
    </div>

    <!-- ==================== 2. 中間主角與兩側按鈕 (緊縮上下高度，零虛位) ==================== -->
    <main class="relative z-10 flex items-center justify-between px-3 shrink-0 h-[260px] my-1">
      
      <!-- 左側 3 個按鈕 -->
      <div class="flex flex-col gap-2 z-30 w-[24%] max-w-[90px] shrink-0">
        <button id="btn_helmet" onclick="handleSelectGear('helmet')" 
                class="gear-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-slate-900/90 border border-slate-700/80 text-slate-300 shadow-md active:scale-95 transition-all">
          <span class="text-lg">🛡️</span>
          <span class="text-xs font-bold mt-0.5">救恩頭盔</span>
        </button>
        <button id="btn_breastplate" onclick="handleSelectGear('breastplate')" 
                class="gear-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-slate-900/90 border border-slate-700/80 text-slate-300 shadow-md active:scale-95 transition-all">
          <span class="text-lg">✨</span>
          <span class="text-xs font-bold mt-0.5">公義護鏡</span>
        </button>
        <button id="btn_belt" onclick="handleSelectGear('belt')" 
                class="gear-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-slate-900/90 border border-slate-700/80 text-slate-300 shadow-md active:scale-95 transition-all">
          <span class="text-lg">🥋</span>
          <span class="text-xs font-bold mt-0.5">真理腰帶</span>
        </button>
      </div>

      <!-- 中間主角 (滿版裁切、消除頭頂與腳下大留白) -->
      <div class="relative flex-1 h-full flex items-center justify-center">
        <svg id="characterSvg" viewBox="20 40 340 340" class="w-full h-[255px] drop-shadow-2xl" preserveAspectRatio="xMidYMid meet">
          <defs>
            <radialGradient id="sacredHalo" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
              <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="armorSilver" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f8fafc"/>
              <stop offset="40%" stop-color="#cbd5e1"/>
              <stop offset="100%" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="armorGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="50%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#9a3412"/>
            </linearGradient>
            <linearGradient id="capeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ef4444"/>
              <stop offset="50%" stop-color="#dc2626"/>
              <stop offset="100%" stop-color="#7f1d1d"/>
            </linearGradient>
            <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#f0f9ff"/>
              <stop offset="45%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
            <radialGradient id="chibiSkin" cx="45%" cy="38%" r="65%">
              <stop offset="0%" stop-color="#ffedd5"/>
              <stop offset="65%" stop-color="#fed7aa"/>
              <stop offset="100%" stop-color="#fba863"/>
            </radialGradient>
          </defs>

          <!-- 聖光光環 -->
          <circle cx="190" cy="115" r="95" fill="url(#sacredHalo)" class="opacity-80"/>

          <!-- 披風 -->
          <path d="M138 165 C112 225 110 320 128 355 L168 355 L158 220 Z" fill="url(#capeGrad)" stroke="#7f1d1d" stroke-width="2"/>
          <path d="M242 165 C268 225 270 320 252 355 L212 355 L222 220 Z" fill="url(#capeGrad)" stroke="#7f1d1d" stroke-width="2"/>
          <path d="M148 170 Q190 188 232 170 L226 345 Q190 360 154 345 Z" fill="url(#capeGrad)" stroke="#7f1d1d" stroke-width="2" opacity="0.95"/>

          <!-- 腿與身軀 -->
          <rect x="156" y="278" width="28" height="76" rx="10" fill="#1e293b"/>
          <rect x="196" y="278" width="28" height="76" rx="10" fill="#1e293b"/>
          <rect x="148" y="160" width="84" height="92" rx="18" fill="#fdba74"/>

          <!-- 大頭部 -->
          <ellipse cx="190" cy="118" rx="64" ry="56" fill="url(#chibiSkin)"/>
          <ellipse cx="166" cy="120" rx="8" ry="12" fill="#0f172a"/>
          <ellipse cx="214" cy="120" rx="8" ry="12" fill="#0f172a"/>
          <circle cx="169" cy="116" r="3.5" fill="#ffffff"/>
          <circle cx="217" cy="116" r="3.5" fill="#ffffff"/>
          <circle cx="164" cy="123" r="1.8" fill="#ffffff"/>
          <circle cx="212" cy="123" r="1.8" fill="#ffffff"/>
          <path d="M157 105 Q167 101 176 105" stroke="#7c2d12" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M204 105 Q213 101 223 105" stroke="#7c2d12" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M181 135 Q190 144 199 135" stroke="#9a3412" stroke-width="3" stroke-linecap="round" fill="none"/>
          <ellipse cx="152" cy="132" rx="9" ry="5.5" fill="#f43f5e" opacity="0.5"/>
          <ellipse cx="228" cy="132" rx="9" ry="5.5" fill="#f43f5e" opacity="0.5"/>

          <!-- 1. 救恩頭盔 -->
          <g id="gear_helmet" class="gear-item gear-dim" onclick="handleSelectGear('helmet')">
            <path d="M126 112 C102 92 105 58 140 70 C118 78 118 98 132 108 Z" fill="url(#armorGold)" stroke="#78350f" stroke-width="2"/>
            <path d="M254 112 C278 92 275 58 240 70 C262 78 262 98 248 108 Z" fill="url(#armorGold)" stroke="#78350f" stroke-width="2"/>
            <path d="M182 65 Q190 20 198 65 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>
            <path d="M132 110 C130 52 250 52 248 110 C248 76 132 76 132 110 Z" fill="url(#armorSilver)" stroke="#334155" stroke-width="3"/>
            <path d="M130 102 Q190 82 250 102 L246 118 Q190 98 134 118 Z" fill="url(#armorGold)" stroke="#78350f" stroke-width="2"/>
            <rect x="186" y="90" width="8" height="22" rx="2" fill="#dc2626"/>
            <rect x="179" y="97" width="22" height="8" rx="2" fill="#dc2626"/>
            <circle cx="190" cy="101" r="4" fill="#fef08a"/>
          </g>

          <!-- 2. 公義護鏡 -->
          <g id="gear_breastplate" class="gear-item gear-dim" onclick="handleSelectGear('breastplate')">
            <path d="M146 182 L165 168 L215 168 L234 182 L228 252 L190 266 L152 252 Z" fill="url(#armorGold)" stroke="#78350f" stroke-width="3"/>
            <path d="M156 186 L190 176 L224 186 L218 244 L190 256 L162 244 Z" fill="url(#armorSilver)" stroke="#475569" stroke-width="2"/>
            <path d="M185 196 H195 V236 H185 Z M174 207 H206 V217 H174 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
            <circle cx="190" cy="212" r="5" fill="#fef08a"/>
          </g>

          <!-- 3. 真理腰帶 -->
          <g id="gear_belt" class="gear-item gear-dim" onclick="handleSelectGear('belt')">
            <rect x="146" y="254" width="88" height="18" rx="6" fill="#78350f" stroke="#451a03" stroke-width="2"/>
            <rect x="176" y="248" width="28" height="28" rx="6" fill="url(#armorGold)" stroke="#78350f" stroke-width="2.5"/>
            <circle cx="190" cy="262" r="5" fill="#3b82f6"/>
          </g>

          <!-- 4. 信心盾牌 -->
          <g id="gear_shield" class="gear-item gear-dim" onclick="handleSelectGear('shield')">
            <path d="M84 175 Q138 164 144 192 Q146 270 84 314 Q22 270 24 192 Q32 164 84 175 Z" fill="url(#armorGold)" stroke="#78350f" stroke-width="3.5"/>
            <path d="M84 188 Q126 180 131 202 Q133 258 84 296 Q37 258 39 202 Q44 180 84 188 Z" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="2"/>
            <polygon points="84,206 91,225 111,225 95,237 101,256 84,244 67,256 73,237 57,225 77,225" fill="url(#armorGold)"/>
          </g>

          <!-- 5. 聖靈寶劍 -->
          <g id="gear_sword" class="gear-item gear-dim" onclick="handleSelectGear('sword')">
            <path d="M280 220 L302 85 L308 75 L314 85 L336 220 L308 235 Z" fill="url(#bladeGrad)" stroke="#bae6fd" stroke-width="2.5"/>
            <path d="M308 75 L308 235" stroke="#ffffff" stroke-width="2"/>
            <rect x="272" y="228" width="72" height="14" rx="4" fill="url(#armorGold)" stroke="#78350f" stroke-width="2"/>
            <rect x="302" y="242" width="12" height="32" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2"/>
            <circle cx="308" cy="282" r="8.5" fill="url(#armorGold)" stroke="#78350f" stroke-width="2"/>
          </g>

          <!-- 6. 平安鞋 -->
          <g id="gear_shoes" class="gear-item gear-dim" onclick="handleSelectGear('shoes')">
            <path d="M142 344 L182 344 L186 372 L134 372 Z" fill="url(#armorGold)" stroke="#78350f" stroke-width="2.5"/>
            <path d="M198 344 L238 344 L246 372 L194 372 Z" fill="url(#armorGold)" stroke="#78350f" stroke-width="2.5"/>
            <path d="M128 350 Q112 338 126 328 Q122 344 136 350 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
            <path d="M252 350 Q268 338 254 328 Q258 344 244 350 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          </g>
        </svg>

        <!-- 觸控熱區 -->
        <div class="touch-target" style="top: 0%; left: 24%; width: 52%; height: 32%;" onclick="handleSelectGear('helmet')"></div>
        <div class="touch-target" style="top: 32%; left: 33%; width: 34%; height: 26%;" onclick="handleSelectGear('breastplate')"></div>
        <div class="touch-target" style="top: 58%; left: 33%; width: 34%; height: 12%;" onclick="handleSelectGear('belt')"></div>
        <div class="touch-target" style="top: 25%; left: 0%; width: 34%; height: 44%;" onclick="handleSelectGear('shield')"></div>
        <div class="touch-target" style="top: 10%; right: 0%; width: 34%; height: 60%;" onclick="handleSelectGear('sword')"></div>
        <div class="touch-target" style="top: 74%; left: 25%; width: 50%; height: 24%;" onclick="handleSelectGear('shoes')"></div>
      </div>

      <!-- 右側 3 個按鈕 -->
      <div class="flex flex-col gap-2.5 z-30 w-[24%] max-w-[90px] shrink-0">
        <button id="btn_shield" onclick="handleSelectGear('shield')" 
                class="gear-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-slate-900/90 border border-slate-700/80 text-slate-300 shadow-md active:scale-95 transition-all">
          <span class="text-lg">🔰</span>
          <span class="text-xs font-bold mt-0.5">信心盾牌</span>
        </button>
        <button id="btn_sword" onclick="handleSelectGear('sword')" 
                class="gear-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-slate-900/90 border border-slate-700/80 text-slate-300 shadow-md active:scale-95 transition-all">
          <span class="text-lg">⚔️</span>
          <span class="text-xs font-bold mt-0.5">聖靈寶劍</span>
        </button>
        <button id="btn_shoes" onclick="handleSelectGear('shoes')" 
                class="gear-btn flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-slate-900/90 border border-slate-700/80 text-slate-300 shadow-md active:scale-95 transition-all">
          <span class="text-lg">👟</span>
          <span class="text-xs font-bold mt-0.5">平安的鞋</span>
        </button>
      </div>
    </main>

    <!-- ==================== 3. 下方訊息框與宣告按鈕 (緊跟主角、文字大號清晰) ==================== -->
    <div class="relative z-20 px-3 pt-2 shrink-0">
      <div class="p-3.5 rounded-2xl bg-slate-900/95 border-2 border-amber-500/40 backdrop-blur-md shadow-2xl flex flex-col gap-2">
        
        <!-- 標題與重聽 -->
        <div class="flex items-center justify-between shrink-0">
          <div class="flex items-center gap-1.5">
            <span id="msgIcon" class="text-xl">✨</span>
            <span id="msgHeader" class="text-base sm:text-lg font-bold text-amber-300 tracking-wide">屬靈軍裝晨更宣告</span>
          </div>
          <button id="replayBtn" onclick="speakCurrentText()" class="hidden px-2.5 py-1 rounded-lg bg-amber-500/20 border border-amber-400/50 text-amber-200 text-xs font-bold flex items-center gap-1 active:scale-95 transition-all">
            <span>🔊</span>
            <span>重聽</span>
          </button>
        </div>

        <!-- 經文主體：字體特意放大為 text-base 至 text-lg -->
        <div class="max-h-[130px] overflow-y-auto custom-scroll pr-1 my-0.5">
          <p id="msgBody" class="text-base sm:text-lg leading-relaxed text-slate-100 font-bold tracking-wide">
            「屬靈軍裝天天穿戴，魔鬼陣營次次失敗，請點擊一項裝備，顯示要宣告的金句！」
          </p>
          <p id="verseRef" class="hidden text-right text-sm sm:text-base font-extrabold text-amber-400 mt-1"></p>
        </div>

        <!-- 宣告按鈕：緊接在文字下方，絕不跑出螢幕外 -->
        <div class="shrink-0 pt-1">
          <button id="memorizeBtn" onclick="handleConfirmGear()" class="hidden w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 font-black text-base shadow-lg shadow-amber-500/30 active:scale-98 transition-all">
            ✨ 我已背誦默想，穿戴此裝備！
          </button>
          <div id="footerHint" class="text-center text-xs text-slate-400 pt-0.5">
            👆 點選角色身上的裝備或兩側按鈕進行穿戴
          </div>
        </div>

      </div>
    </div>

    <!-- ==================== 彈窗 1：玩家名字設定彈窗 (大字號高辨識度版) ==================== -->
    <div id="nameModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
      <div class="bg-gradient-to-b from-slate-900 to-indigo-950 border-2 border-amber-400/60 rounded-3xl p-6 w-full max-w-sm shadow-2xl text-center">
        <div class="text-4xl mb-2">🛡️</div>
        <h3 class="text-xl sm:text-2xl font-black text-amber-300 mb-1">請輸入勇士大名</h3>
        <p class="text-sm text-slate-200 mb-4 font-medium">中文最多 5 字，英文字母最多 10 字</p>

        <div class="relative mb-2">
          <input id="nameInput" type="text" maxlength="10" placeholder="例如：約書亞 / Joshua" 
                 oninput="handleNameInputLive(this)"
                 class="w-full px-4 py-3 rounded-xl bg-slate-800 border-2 border-amber-400/60 text-amber-100 text-center font-extrabold text-lg sm:text-xl focus:outline-none focus:ring-2 focus:ring-amber-300">
        </div>
        <div id="nameWeightTip" class="text-xs text-amber-300/80 mb-4 text-right pr-2 font-semibold">0 / 10 單位</div>

        <button onclick="savePlayerName()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 font-black text-base sm:text-lg shadow-lg active:scale-95 transition-all">
          領取屬靈軍裝進入戰役
        </button>
      </div>
    </div>

    <!-- ==================== 彈窗 2：中央得勝彈窗 ==================== -->
    <div id="victoryModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
      <div class="bg-gradient-to-b from-indigo-950 via-slate-900 to-amber-950 border-2 border-amber-400 rounded-3xl p-6 w-full max-w-sm shadow-2xl text-center">
        <div class="text-5xl mb-2">👑</div>
        <div class="inline-block px-3 py-1 bg-amber-500/20 rounded-full border border-amber-400/40 text-amber-300 text-xs font-semibold mb-3">
          得勝宣告達成
        </div>
        
        <h3 id="victoryTitle" class="text-base sm:text-lg font-black text-amber-300 mb-3 tracking-wide border-b border-amber-400/20 pb-1.5">
          2026/10/29 - 神國勇士 - 完成屬靈軍裝
        </h3>
        
        <p class="text-sm sm:text-base font-bold text-slate-100 leading-relaxed mb-4">
          「屬靈軍裝已穿上，魔鬼再強也退讓，相信今天必定是得勝的一天！」
        </p>

        <button onclick="closeVictoryModal()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 font-black text-base shadow-xl shadow-amber-500/40 active:scale-95 transition-all">
          阿們！領受並出發！
        </button>
      </div>
    </div>

    <!-- ==================== 彈窗 3：核取曆彈窗 ==================== -->
    <div id="calendarModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
      <div class="bg-slate-900 border border-amber-400/40 rounded-3xl p-5 w-full max-w-sm shadow-2xl flex flex-col">
        <div class="flex items-center justify-between pb-2 border-b border-slate-700 mb-2">
          <div>
            <h3 id="calMonthTitle" class="text-base font-bold text-amber-300">2026年10月 核取曆</h3>
            <p class="text-xs text-slate-400">每日穿齊六件裝備自動打勾，每月1日重計</p>
          </div>
          <button onclick="toggleCalendarModal(false)" class="text-slate-400 hover:text-white text-2xl font-bold p-1">×</button>
        </div>

    /* 安全儲存層：localStorage + Cookie 雙保險 */
    const SafeStorage = {
      set(key, val) {
        try { localStorage.setItem(key, val); } catch (e) {}
        try {
          const d = new Date();
          d.setTime(d.getTime() + (365*24*60*60*1000));
          document.cookie = `${encodeURIComponent(key)}=${encodeURIComponent(val)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
        } catch (e) {}
      },
      get(key) {
        try {
          const item = localStorage.getItem(key);
          if (item !== null) return item;
        } catch (e) {}
        try {
          const name = encodeURIComponent(key) + "=";
          const ca = document.cookie.split(';');
          for(let i=0; i<ca.length; i++) {
            let c = ca[i].trim();
            if (c.indexOf(name) === 0) return decodeURIComponent(c.substring(name.length, c.length));
          }
        } catch (e) {}
        return null;
      }
    };

    function unlockAudioAndSpeech() {
      if (isAudioEngineUnlocked) return;

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          if (!audioCtx) audioCtx = new AudioContextClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();
        }
      } catch (e) {}

      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();
          const u = new SpeechSynthesisUtterance(' ');
          u.volume = 0.01;
          u.rate = 10;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }

      isAudioEngineUnlocked = true;
    }

    ['touchstart', 'touchend', 'click'].forEach(evt => {
      document.addEventListener(evt, unlockAudioAndSpeech, { passive: true });
    });

    function playChime(type) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'select') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'equip') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
          osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.4);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        } else if (type === 'victory') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'triangle';
            o.frequency.value = freq;
            o.connect(g);
            g.connect(audioCtx.destination);
            g.gain.setValueAtTime(0.18, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.8);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.85);
          });
        }
      } catch (e) {}
    }

    function speakText(textToSpeak) {
      if (!isTtsEnabled) return;
      currentSpeechText = textToSpeak;

      if (!('speechSynthesis' in window)) return;

      try {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'zh-TW';
        utterance.rate = 0.92;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        const voices = window.speechSynthesis.getVoices();
        if (voices && voices.length > 0) {
          const twVoice = voices.find(v => 
            v.lang === 'zh-TW' || 
            v.lang === 'zh_TW' || 
            v.name.includes('Taiwan') || 
            v.name.includes('Mei-Jia') || 
            v.name.includes('國語')
          ) || voices.find(v => v.lang.startsWith('zh'));
          if (twVoice) utterance.voice = twVoice;
        }

        window.speechSynthesis.speak(utterance);
      } catch (err) {
        console.warn("TTS Error:", err);
      }
    }

    function speakCurrentText() {
      unlockAudioAndSpeech();
      if (currentSpeechText) speakText(currentSpeechText);
    }

    function toggleTtsSetting() {
      unlockAudioAndSpeech();
      isTtsEnabled = !isTtsEnabled;
      const btn = document.getElementById('ttsToggleBtn');
      if (isTtsEnabled) {
        btn.innerText = '🔊';
        btn.classList.replace('text-slate-500', 'text-amber-300');
        speakCurrentText();
      } else {
        btn.innerText = '🔇';
        btn.classList.replace('text-amber-300', 'text-slate-500');
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
      SafeStorage.set('armor_tts_pref', isTtsEnabled ? '1' : '0');
    }

    function truncateNameToMaxWeight(str, maxWeight = 10) {
      let currentWeight = 0;
      let result = "";
      for (let i = 0; i < str.length; i++) {
        const char = str[i];
        const w = char.charCodeAt(0) > 255 ? 2 : 1;
        if (currentWeight + w <= maxWeight) {
          currentWeight += w;
          result += char;
        } else {
          break;
        }
      }
      return { result, currentWeight };
    }

    function handleNameInputLive(inputEl) {
      const { result, currentWeight } = truncateNameToMaxWeight(inputEl.value, 10);
      if (inputEl.value !== result) inputEl.value = result;
      document.getElementById('nameWeightTip').innerText = `${currentWeight} / 10 單位 (中文=2, 英文=1)`;
    }

      handleNameInputLive(input);
      document.getElementById('nameModal').classList.remove('hidden');

      name = result || "神國勇士";

      document.getElementById('nameModal').classList.add('hidden');

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function getMonthKeyString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function pickScriptureForGear(gearKey) {
      const currentMonthKey = getMonthKeyString();
      const storageKey = `armor_hist_${currentMonthKey}_${gearKey}`;
      let usedIndexes = [];
      try {
        usedIndexes = JSON.parse(SafeStorage.get(storageKey) || '[]');
      } catch (e) { usedIndexes = []; }

      const list = SCRIPTURE_DB[gearKey];
      if (usedIndexes.length >= list.length) usedIndexes = [];

      const available = [];
      for (let i = 0; i < list.length; i++) {
        if (!usedIndexes.includes(i)) available.push(i);
      }

      const chosenIndex = available[Math.floor(Math.random() * available.length)];
      usedIndexes.push(chosenIndex);
      SafeStorage.set(storageKey, JSON.stringify(usedIndexes));

      return list[chosenIndex];
    }

    function triggerVictoryFlow() {
      playChime('victory');
      const playerName = SafeStorage.get('armor_player_name') || '神國勇士';
      const todayStr = getTodayString();

      monthlyRecords[todayStr] = true;
      saveMonthlyRecords();

      document.getElementById('victoryTitle').innerText = `${todayStr} - ${playerName} - 完成屬靈軍裝`;
      document.getElementById('victoryModal').classList.remove('hidden');

      const victoryMsg = "屬靈軍裝已穿上，魔鬼再強也退讓，相信今天必定是得勝的一天！";
      document.getElementById('msgIcon').innerText = '👑';
      document.getElementById('msgHeader').innerText = '得勝的一天！';
      document.getElementById('msgBody').innerText = victoryMsg;
      document.getElementById('verseRef').classList.add('hidden');
      document.getElementById('memorizeBtn').classList.add('hidden');
      document.getElementById('replayBtn').classList.remove('hidden');
      document.getElementById('footerHint').classList.add('hidden');

      speakText(victoryMsg);
    }

    function closeVictoryModal() {
      unlockAudioAndSpeech();
      document.getElementById('victoryModal').classList.add('hidden');
    }

    function updateProgressDisplay() {
      document.getElementById('progressText').innerText = `進度 ${todayFinishedGears.size} / 6`;
    }

    function toggleCalendarModal(show) {
      unlockAudioAndSpeech();
      const modal = document.getElementById('calendarModal');
      if (show) {
        renderCalendarGrid();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function renderCalendarGrid() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayWeekIndex = new Date(year, month, 1).getDay();

      document.getElementById('calMonthTitle').innerText = `${year}年${month + 1}月 核取曆`;

      const grid = document.getElementById('calendarDaysGrid');
      grid.innerHTML = '';

      ['日', '一', '二', '三', '四', '五', '六'].forEach(w => {
        const head = document.createElement('div');
        head.className = "text-[11px] font-bold text-amber-400/80 py-0.5";
        head.innerText = w;
        grid.appendChild(head);
      });

      for (let i = 0; i < firstDayWeekIndex; i++) {
        const blank = document.createElement('div');
        blank.className = "p-1";
        grid.appendChild(blank);
      }

      let completedDays = 0;
      const todayDateNumber = now.getDate();

      for (let d = 1; d <= daysInMonth; d++) {
        const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isCompleted = !!monthlyRecords[dayStr];
        if (isCompleted) completedDays++;

        const isToday = d === todayDateNumber;
        const cell = document.createElement('div');
        cell.className = `h-8 rounded-lg flex flex-col items-center justify-center text-[11px] font-bold transition-all relative ${
          isCompleted 
            ? 'bg-emerald-500/20 border border-emerald-400 text-emerald-300' 
            : isToday 
              ? 'bg-amber-500/20 border border-amber-400 text-amber-200' 
              : 'bg-slate-800/50 border border-slate-700/60 text-slate-400'
        }`;

        cell.innerHTML = `
          <span>${d}</span>
          ${isCompleted ? '<span class="text-[9px] leading-none text-emerald-400 font-extrabold">✓</span>' : ''}
        `;
        grid.appendChild(cell);
      }

      document.getElementById('calCompletedCount').innerText = `本月完成：${completedDays} 天`;
    }

    function checkDateAndMidnightReset() {
      const savedDate = SafeStorage.get('armor_last_date');
      const todayStr = getTodayString();
      const currentMonthKey = getMonthKeyString();
      const savedMonthKey = SafeStorage.get('armor_last_month');

      if (savedMonthKey !== currentMonthKey) {
        monthlyRecords = {};
        SafeStorage.set('armor_monthly_records_' + currentMonthKey, JSON.stringify(monthlyRecords));
        SafeStorage.set('armor_last_month', currentMonthKey);
      } else {
        try {
          monthlyRecords = JSON.parse(SafeStorage.get('armor_monthly_records_' + currentMonthKey) || '{}');
        } catch (e) { monthlyRecords = {}; }
      }

      if (savedDate !== todayStr) {
        todayFinishedGears.clear();
        SafeStorage.set('armor_last_date', todayStr);
        saveDailyProgress();
        resetUIAfterMidnight();
      } else {
        try {
          const list = JSON.parse(SafeStorage.get('armor_daily_progress') || '[]');
          todayFinishedGears = new Set(list);
        } catch (e) { todayFinishedGears = new Set(); }
        applyGearVisuals();
      }

      updateProgressDisplay();
      updateDateHeader();
    }

    function resetUIAfterMidnight() {
      document.querySelectorAll('.gear-item').forEach(el => {
        el.classList.remove('gear-active', 'gear-glow');
        el.classList.add('gear-dim');
      });
      document.querySelectorAll('.gear-btn').forEach(btn => {
        btn.classList.remove('border-emerald-500/60', 'bg-emerald-950/40', 'text-emerald-300', 'border-amber-400', 'bg-amber-500/20');
        btn.classList.add('border-slate-700/80', 'bg-slate-900/90', 'text-slate-300');
      });
      document.getElementById('msgIcon').innerText = '✨';
      document.getElementById('msgHeader').innerText = '屬靈軍裝晨更宣告';
      document.getElementById('msgBody').innerText = '「屬靈軍裝天天穿戴，魔鬼陣營次次失敗，請點擊一項裝備，顯示要宣告的金句！」';
      document.getElementById('verseRef').classList.add('hidden');
      document.getElementById('memorizeBtn').classList.add('hidden');
      document.getElementById('replayBtn').classList.add('hidden');
      document.getElementById('footerHint').classList.remove('hidden');
    }

    function applyGearVisuals() {
      document.querySelectorAll('.gear-item').forEach(el => {
        el.classList.remove('gear-active', 'gear-glow');
        el.classList.add('gear-dim');
      });
      todayFinishedGears.forEach(gearKey => {
        const el = document.getElementById(`gear_${gearKey}`);
        if (el) {
          el.classList.remove('gear-dim');
          el.classList.add('gear-active');
        }
        const btn = document.getElementById(`btn_${gearKey}`);
        if (btn) {
          btn.classList.add('border-emerald-500/60', 'bg-emerald-950/40', 'text-emerald-300');
        }
      });
    }

    function saveDailyProgress() {
      SafeStorage.set('armor_daily_progress', JSON.stringify(Array.from(todayFinishedGears)));
    }

    function saveMonthlyRecords() {
      const currentMonthKey = getMonthKeyString();
      SafeStorage.set('armor_monthly_records_' + currentMonthKey, JSON.stringify(monthlyRecords));
    }

    function updateDateHeader() {
      const now = new Date();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const dayArr = ['日', '一', '二', '三', '四', '五', '六'];
      document.getElementById('headerDate').innerText = `${now.getFullYear()}年${m}月${d}日 週${dayArr[now.getDay()]}`;
    }

    function initCanvasAnimation() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];

      function resize() {
        w = canvas.width = canvas.parentElement.clientWidth;
        h = canvas.height = canvas.parentElement.clientHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      for (let i = 0; i < 20; i++) {
        particles.push({
          x: Math.random() * (w || 360),
          y: Math.random() * (h || 640),
          r: Math.random() * 2 + 0.6,
          speedY: -(Math.random() * 0.4 + 0.15),
          alpha: Math.random() * 0.6 + 0.2
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#fef08a";

        particles.forEach(p => {
          p.y += p.speedY;
          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedTts = SafeStorage.get('armor_tts_pref');
      if (savedTts !== null) {
        isTtsEnabled = savedTts === '1';
        const btn = document.getElementById('ttsToggleBtn');
        btn.innerText = isTtsEnabled ? '🔊' : '🔇';
        if (!isTtsEnabled) btn.classList.replace('text-amber-300', 'text-slate-500');
      }

      const savedName = SafeStorage.get('armor_player_name');
      if (!savedName) {
        setTimeout(openNameModal, 300);
      } else {
        document.getElementById('playerDisplayName').innerText = savedName;
      }

      checkDateAndMidnightReset();
      setInterval(checkDateAndMidnightReset, 60000);
      initCanvasAnimation();

      currentSpeechText = "屬靈軍裝天天穿戴，魔鬼陣營次次失敗，請點擊一項裝備，顯示要宣告的金句！";

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    });
  </script>
</body>

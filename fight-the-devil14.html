<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打擊魔鬼街機挑戰</title>

    <!-- Tone.js for Web Audio Synthesis -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- 官方 Firebase SDK 模組 (保證各家電信 4G/5G、iPhone Safari、Android 跨手機 100% 暢通) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 公開跨裝置排行榜雲端設定
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyD-ArcadeDemonStrikePublic2026Key",
                authDomain: "demon-whacker-arcade.firebaseapp.com",
                projectId: "demon-whacker-arcade",
                storageBucket: "demon-whacker-arcade.appspot.com",
                messagingSenderId: "389271649201",
                appId: "1:389271649201:web:9f8d1c7e6b5a4321"
            };

        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'demon-whacker-arcade-2026';

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // 認證優先：先完成匿名或自訂 Token 登入
            const authPromise = (typeof __initial_auth_token !== 'undefined' && __initial_auth_token)
                ? signInWithCustomToken(auth, __initial_auth_token)
                : signInAnonymously(auth);

            authPromise.then((userCredential) => {
                const user = userCredential.user;
                console.log("雲端資料庫已連線，玩家 ID:", user.uid);
                
                // 註冊至全域供遊戲呼叫
                window.CloudDB = {
                    db,
                    auth,
                    appId: currentAppId,
                    collection,
                    addDoc,
                    getDocs,
                    onSnapshot,
                    isReady: true
                };

                if (typeof window.bindCloudLeaderboard === 'function') {
                    window.bindCloudLeaderboard();
                }
            }).catch((err) => {
                console.warn("Auth initialization notice:", err);
                window.startFallbackLeaderboard();
            });
        } catch (e) {
            console.warn("Firebase Init Notice:", e);
            if (typeof window.startFallbackLeaderboard === 'function') {
                window.startFallbackLeaderboard();
            }
        }
    </script>

    <script>
        tailwind.config = {
            theme: {

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #080911;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
        }

        /* 敲擊動畫 */
        @keyframes whackImpact {
            0% { transform: scale(1); filter: brightness(1); }
            40% { transform: scale(0.86); filter: brightness(2.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        .impact-anim {
            animation: whackImpact 0.22s ease-out forwards;
        }

        /* 警告燈呼吸閃爍 */
        @keyframes redPulse {
            0%, 100% { opacity: 0.25; filter: drop-shadow(0 0 1px #ff1744); }
            50% { opacity: 1; filter: drop-shadow(0 0 8px #ff1744); }
        }
        .warning-red {
            animation: redPulse 0.25s infinite ease-in-out;
        }

        @keyframes bluePulse {
            0%, 100% { opacity: 0.25; filter: drop-shadow(0 0 1px #00e5ff); }
            50% { opacity: 1; filter: drop-shadow(0 0 8px #00e5ff); }
        }
        .warning-blue {
            animation: bluePulse 0.25s infinite ease-in-out;
        }

        /* 浮動得分飄字 */
        @keyframes floatUpFade {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.6); }
            20% { opacity: 1; transform: translate(-50%, -10px) scale(1.15); }
            80% { opacity: 1; transform: translate(-50%, -30px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -45px) scale(0.85); }
        }
        .float-text {
            position: absolute;
            pointer-events: none;
            animation: floatUpFade 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            z-index: 40;
            font-weight: 900;
        }

        /* 柔和捲軸 */

            width: 4px;
        }

            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>

    <!-- JAVASCRIPT GAME LOGIC -->
    <script>
        /* ==========================================================
           1. CONSTANTS & GAME STATE
           ========================================================== */
        const TOTAL_HOLES = 12; // 3 欄 x 4 列 = 12 個洞口
        const STAGE_DURATION = 30; // 每一關 30 秒

        let currentStage = 1;      // 1, 2, 3
        let score = 0;
        let highScore = parseInt(localStorage.getItem("demon_strike_highscore") || "0", 10);
        let timeLeft = STAGE_DURATION;
        let combo = 0;
        let maxCombo = 0;
        let demonsHit = 0;
        let angelsHit = 0;

        let isPlaying = false;
        let isTransitioning = false;
        let playerName = localStorage.getItem("demon_strike_player_name") || "獵魔勇者";

        let mainTimerInterval = null;
        let spawnLoopTimeout = null;

        // 洞口狀態管理
        // holeState: { active: bool, type: 'demon'|'gold'|'angel', timeoutId, warningTimeoutId }
        const holes = Array.from({ length: TOTAL_HOLES }, () => ({
            active: false,
            type: null,
            timeoutId: null,
            warningTimeoutId: null
        }));

        // 鍵盤映射 (九宮格與一般英文字母)
        const KEY_MAP = {
            '1': 0, '2': 1, '3': 2,
            '4': 3, '5': 4, '6': 5,
            '7': 6, '8': 7, '9': 8,
            '*': 9, '0': 10, '#': 11,
            'q': 0, 'w': 1, 'e': 2,
            'a': 3, 's': 4, 'd': 5,
            'z': 6, 'x': 7, 'c': 8,
            'v': 9, 'b': 10, 'n': 11
        };

        /* ==========================================================
           2. TONE.JS AUDIO SYNTHESIS
           ========================================================== */
        let audioInitialized = false;
        let sfxHit = null;
        let sfxAngel = null;
        let sfxGold = null;
        let sfxWarn = null;
        let sfxStage = null;
        let bgmSynth = null;
        let bgmLoop = null;

        function initAudio() {
            if (audioInitialized) return;
            try {
                Tone.start();

                // 打擊魔鬼音效 (清脆街機敲擊打擊感)
                sfxHit = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 4,
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0.01, release: 0.2 }
                }).toDestination();

                // 打到天使扣分音效 (低音錯誤蜂鳴)
                sfxAngel = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.35, sustain: 0, release: 0.1 }
                }).toDestination();

                // 金色魔王音效 (高音和弦鈴音)
                sfxGold = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.25, sustain: 0.1, release: 0.3 }
                }).toDestination();

                // 警告燈預警音 (短嗶聲)
                sfxWarn = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.005, decay: 0.06, sustain: 0, release: 0.02 },
                    volume: -12
                }).toDestination();

                // 關卡晉升音效
                sfxStage = new Tone.PolySynth(Tone.Synth, {
                    volume: -4
                }).toDestination();

                // 背景節奏合成器
                bgmSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    volume: -14
                }).toDestination();

                // 背景音律旋律 (8-bit 循環)
                const bassNotes = ["C3", "E3", "G3", "B2", "A2", "C3", "E3", "G2"];
                let noteIndex = 0;
                bgmLoop = new Tone.Loop((time) => {
                    const note = bassNotes[noteIndex % bassNotes.length];
                    bgmSynth.triggerAttackRelease(note, "16n", time);
                    noteIndex++;
                }, "8n");

                audioInitialized = true;
            } catch (e) {
                console.warn("Audio initialization issue:", e);
            }
        }

        function playHitSound() {

                        transitionToStage(2, "進入第二關：雙魔齊舞！", "注意！魔鬼開始成雙出現或時間差竄出！", 152);

        /* ==========================================================
           5. SPAWN LOGIC & TIMING
           ========================================================== */
        function scheduleNextSpawn() {
            if (!isPlaying || isTransitioning) return;

            // 根據關卡決定隨機生成的目標數
            let targetCount = 1;
            if (currentStage === 2) {
                targetCount = Math.random() < 0.65 ? 2 : 1;
            } else if (currentStage === 3) {
                const rand = Math.random();
                targetCount = rand < 0.5 ? 3 : (rand < 0.85 ? 2 : 1);
            }

            // 隨機選取閒置洞口
            const availableHoles = [];
            for (let i = 0; i < TOTAL_HOLES; i++) {
                if (!holes[i].active) availableHoles.push(i);
            }

            // 洗牌打亂
            availableHoles.sort(() => Math.random() - 0.5);
            const chosen = availableHoles.slice(0, targetCount);

            chosen.forEach((holeIdx, index) => {
                // 若多隻出現，可有微小的時間差竄出
                const delay = (currentStage >= 2 && Math.random() < 0.5) ? (index * 160) : 0;
                setTimeout(() => {
                    spawnTargetAtHole(holeIdx);
                }, delay);
            });

            // 下一次生成的節奏間隔
            let nextDelay = 800;
            if (currentStage === 1) {
                nextDelay = 650 + Math.random() * 350;
            } else if (currentStage === 2) {
                nextDelay = 500 + Math.random() * 300;
            } else {
                nextDelay = 380 + Math.random() * 260;
            }

            clearTimeout(spawnLoopTimeout);
            spawnLoopTimeout = setTimeout(scheduleNextSpawn, nextDelay);
        }

        function spawnTargetAtHole(index) {
            if (!isPlaying || holes[index].active) return;

            const hole = holes[index];
            hole.active = true;

            // 決定目標種類
            const rand = Math.random();
            if (rand < 0.16) {
                hole.type = 'angel'; // 干擾天使
            } else if (rand < 0.30) {
                hole.type = 'gold';  // 金色魔王
            } else {
                hole.type = 'demon'; // 普通魔鬼
            }

            const lightEl = document.getElementById(`light-${index}`);
            const charEl = document.getElementById(`char-${index}`);
            const rimEl = document.getElementById(`rim-${index}`);

            // 頂部信號燈預告
            playWarningSound();
            if (hole.type === 'angel') {
                lightEl.className = "absolute top-1.5 w-3.5 h-1.5 rounded-full bg-cyan-400 warning-blue";
                rimEl.className = "absolute inset-0 rounded-xl pointer-events-none border border-cyan-500/40 transition-colors";
            } else if (hole.type === 'gold') {
                lightEl.className = "absolute top-1.5 w-3.5 h-1.5 rounded-full bg-amber-400 warning-gold";
                rimEl.className = "absolute inset-0 rounded-xl pointer-events-none border border-amber-500/50 transition-colors";
            } else {
                lightEl.className = "absolute top-1.5 w-3.5 h-1.5 rounded-full bg-rose-500 warning-red";
                rimEl.className = "absolute inset-0 rounded-xl pointer-events-none border border-rose-500/40 transition-colors";
            }

            // 預告 160ms 後竄出
            hole.warningTimeoutId = setTimeout(() => {
                if (!hole.active) return;

                // 填入 SVG
                if (hole.type === 'angel') charEl.innerHTML = ANGEL_SVG;
                else if (hole.type === 'gold') charEl.innerHTML = GOLD_DEVIL_SVG;
                else charEl.innerHTML = DEVIL_SVG;

                // 竄出動畫
                charEl.style.transform = "translateY(0%)";

                // 停留時間（停留結束自動縮回）
                let stayDuration = 850;
                if (currentStage === 2) stayDuration = 680;
                if (currentStage === 3) stayDuration = 520;

                hole.timeoutId = setTimeout(() => {
                    hideHole(index);
                }, stayDuration);
            }, 160);
        }

        function hideHole(index) {
            const hole = holes[index];
            clearTimeout(hole.timeoutId);
            clearTimeout(hole.warningTimeoutId);

            const charEl = document.getElementById(`char-${index}`);
            const lightEl = document.getElementById(`light-${index}`);
            const rimEl = document.getElementById(`rim-${index}`);

            if (charEl) charEl.style.transform = "translateY(100%)";
            if (lightEl) lightEl.className = "absolute top-1.5 w-3 h-1.5 rounded-full bg-slate-800 transition-all opacity-40";
            if (rimEl) rimEl.className = "absolute inset-0 rounded-xl pointer-events-none border border-transparent transition-colors";

            hole.active = false;
            hole.type = null;
        }

        function clearAllHoles() {
            clearTimeout(spawnLoopTimeout);
            for (let i = 0; i < TOTAL_HOLES; i++) {
                hideHole(i);
            }
        }

        /* ==========================================================
           6. WHACKING LOGIC
           ========================================================== */
        function whackHole(index) {
            if (!isPlaying || isTransitioning) return;
            const hole = holes[index];
            const holeEl = document.getElementById(`hole-${index}`);

            // 打擊震動特效
            holeEl.classList.remove("impact-anim");
            void holeEl.offsetWidth;
            holeEl.classList.add("impact-anim");

            if (!hole.active || !hole.type) {
                // 揮空：中斷連擊
                combo = 0;
                updateStatsUI();
                return;
            }

            const targetType = hole.type;
            const rect = holeEl.getBoundingClientRect();
            const posX = rect.left + rect.width / 2;
            const posY = rect.top + rect.height / 2;

            if (targetType === 'demon') {
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                demonsHit++;
                const bonus = Math.min((combo - 1) * 10, 150);
                const gained = 100 + bonus;
                score += gained;
                playHitSound();
                showFloatingText(`+${gained}`, posX, posY, "#fb7185");
            } else if (targetType === 'gold') {
                combo += 2;
                if (combo > maxCombo) maxCombo = combo;
                demonsHit++;
                const gained = 200 + (combo * 15);
                score += gained;
                playGoldSound();
                showFloatingText(`+${gained} CRIT!`, posX, posY, "#f59e0b");
            } else if (targetType === 'angel') {
                // 誤傷天使扣分並歸零連擊
                combo = 0;
                angelsHit++;
                score = Math.max(0, score - 150);
                playAngelSound();
                showFloatingText("-150 誤擊!", posX, posY, "#38bdf8");
            }

            hideHole(index);
            updateStatsUI();
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement("div");
            el.className = "float-text text-sm sm:text-base";
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            el.innerText = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        function updateStatsUI() {

        function validateName(str) {
            // 純中文最多 5 字、純英文最多 10 字母、混合不超過 15 字元
            const trimmed = str.trim();
            if (!trimmed) return { valid: false, msg: "名字不能為空！" };

            const isPureChinese = /^[\u4e00-\u9fa5]+$/.test(trimmed);
            const isPureEnglish = /^[a-zA-Z0-9\s]+$/.test(trimmed);

            if (isPureChinese) {
                if (trimmed.length > 5) return { valid: false, msg: "純中文名字最多 5 個字！" };
            } else if (isPureEnglish) {
                if (trimmed.length > 10) return { valid: false, msg: "純英文名字最多 10 個字母！" };
            } else {
                if (trimmed.length > 15) return { valid: false, msg: "中英混合名字最多 15 個字元！" };
            }

            return { valid: true, name: trimmed };
        }

        function savePlayerName() {
            const input = document.getElementById("playerNameInput");
            const res = validateName(input.value);
            if (!res.valid) {
                document.getElementById("nameError").innerText = res.msg;
                return;
            }

            playerName = res.name;
            localStorage.setItem("demon_strike_player_name", playerName);
            document.getElementById("headerPlayerName").innerText = playerName;
            closeNameModal();
        }

        // 綁定雲端即時同步監聽 (各手機打完即時出現在所有手機上)
        window.bindCloudLeaderboard = function() {
            if (!window.CloudDB || !window.CloudDB.isReady) return;
            const { db, appId, collection, onSnapshot } = window.CloudDB;
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');

            // 即時監聽：任何手機新增分數，所有開啟的手機都會自動觸發更新！
            onSnapshot(colRef, (snapshot) => {
                const list = [];
                snapshot.forEach(docSnap => {
                    const d = docSnap.data();
                    if (d && d.name && typeof d.score === 'number') {
                        list.push(d);
                    }
                });

                if (list.length > 0) {
                    // 記憶體排序（Rule 2：不在 Firestore 做複雜 orderBy，在前端 JS 排序）
                    list.sort((a, b) => b.score - a.score);
                    leaderboardData = list.slice(0, 30);
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(leaderboardData));
                    updateSyncBadge(`全球已連線 (${leaderboardData.length}筆)`, "text-emerald-400 bg-emerald-950 border-emerald-800");
                    renderLeaderboard();
                }
            }, (error) => {
                console.warn("Firestore snapshot notice:", error);
                window.startFallbackLeaderboard();
            });
        };

        // 備援管道（使用保證無 CORS 阻擋的極簡公開通道，雙重保險）
        const PUBLIC_JSON_API = "https://api.restful-api.dev/objects";
        const FALLBACK_BIN_KEY = "demon_whacker_shared_scores_v1";

        window.startFallbackLeaderboard = async function() {
            // 先載入本機快取
            const localCached = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (localCached) {
                try {
                    const parsed = JSON.parse(localCached);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        leaderboardData = parsed;
                        renderLeaderboard();
                    }
                } catch(e) {}
            }
            await fetchOnlineLeaderboard(false);
        };

        async function initCloudStorage() {

        // 手動拉取排行
        async function fetchOnlineLeaderboard(showLoading = false) {
            if (showLoading) {
                updateSyncBadge("更新全網榜單...", "text-amber-400 bg-amber-950 border-amber-800");
            }

            if (window.CloudDB && window.CloudDB.isReady) {
                const { db, appId, collection, getDocs } = window.CloudDB;
                try {
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                    const snap = await getDocs(colRef);
                    const list = [];
                    snap.forEach(d => list.push(d.data()));
                    if (list.length > 0) {
                        list.sort((a, b) => b.score - a.score);
                        leaderboardData = list.slice(0, 30);
                        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(leaderboardData));
                        updateSyncBadge(`全網已同步 (${leaderboardData.length}筆)`, "text-emerald-400 bg-emerald-950 border-emerald-800");
                        renderLeaderboard();
                        return;
                    }
                } catch(e) {
                    console.warn("SDK Fetch fallback:", e);
                }
            }

            // 備援全球公開 REST 通道
            try {
                const res = await fetch(`https://api.counterapi.dev/v1/demon_strike_2026/get_scores?_=${Date.now()}`).catch(() => null);
                if (res && res.ok) {
                    const json = await res.json();
                    if (json && Array.isArray(json.data)) {
                        leaderboardData = json.data.sort((a,b) => b.score - a.score).slice(0, 30);
                        renderLeaderboard();
                        updateSyncBadge(`備援已連線 (${leaderboardData.length}筆)`, "text-emerald-400 bg-emerald-950 border-emerald-800");
                        return;
                    }
                }
            } catch(e) {}

            updateSyncBadge("離線模式 (本機同步)", "text-slate-400 bg-slate-900 border-slate-700");
            renderLeaderboard();
        }

        // 上傳成績至雲端供所有手機讀取
        async function saveScoreRecord() {
            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            const newRecord = {
                name: playerName,
                score: score,
                stage: currentStage,
                demonsHit: demonsHit,
                maxCombo: maxCombo,
                date: dateStr,
                timestamp: Date.now()
            };

            // 1. 本機即時展示
            leaderboardData.unshift(newRecord);
            leaderboardData.sort((a, b) => b.score - a.score);
            leaderboardData = leaderboardData.slice(0, 30);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(leaderboardData));
            renderLeaderboard();

            updateSyncBadge("成績上傳中...", "text-amber-400 bg-amber-950 border-amber-800");

            // 2. 透過官方 SDK 上傳至全域公共路徑（保證不覆蓋其他手機成績，採追加模式）
            if (window.CloudDB && window.CloudDB.isReady) {
                const { db, appId, collection, addDoc } = window.CloudDB;
                try {
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                    await addDoc(colRef, newRecord);
                    updateSyncBadge("雲端成績已同步！", "text-emerald-400 bg-emerald-950 border-emerald-800");
                    return;
                } catch (err) {
                    console.warn("Firestore addDoc notice:", err);
                }
            }

            // 備援通道上傳
            try {
                await fetch("https://api.counterapi.dev/v1/demon_strike_2026/push_score", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(newRecord),
                    mode: 'no-cors' // 避免任何 CORS 報錯
                });
                updateSyncBadge("已上傳至全網！", "text-emerald-400 bg-emerald-950 border-emerald-800");
            } catch (err) {
                updateSyncBadge("已保存在本機", "text-slate-400 bg-slate-900 border-slate-700");
            }
        }

        function openLeaderboard() {
            renderLeaderboard();
            document.getElementById("leaderboardModal").classList.remove("hidden");
            fetchOnlineLeaderboard(true);
        }

        function closeLeaderboard() {
            document.getElementById("leaderboardModal").classList.add("hidden");
        }

        function renderLeaderboard() {
            const list = document.getElementById("leaderboardList");
            if (!list) return;
            list.innerHTML = "";

            if (!leaderboardData || leaderboardData.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">目前暫無紀錄，快成為第一位登榜勇者！</div>`;
                return;
            }

            leaderboardData.forEach((item, index) => {
                const row = document.createElement("div");
                const isCurrent = item.name === playerName && item.score === score;

                let rankBadge = `<span class="w-4 text-center font-bold text-slate-500 text-[10px]">${index + 1}</span>`;
                if (index === 0) rankBadge = `<span class="w-4 text-center text-amber-400 font-extrabold text-xs">🥇</span>`;
                else if (index === 1) rankBadge = `<span class="w-4 text-center text-slate-300 font-extrabold text-xs">🥈</span>`;
                else if (index === 2) rankBadge = `<span class="w-4 text-center text-amber-600 font-extrabold text-xs">🥉</span>`;

                row.className = `flex items-center justify-between p-1.5 rounded-lg border ${
                    isCurrent ? 'bg-amber-500/15 border-amber-500/50 text-amber-200' : 'bg-slate-950/60 border-slate-800 text-slate-300'
                }`;

                row.innerHTML = `
                    <div class="flex items-center gap-1.5 overflow-hidden">
                        ${rankBadge}
                        <div class="flex flex-col min-w-0">
                            <div class="flex items-center gap-1">
                                <span class="font-bold truncate max-w-[100px] text-[11px]">${item.name}</span>
                                ${isCurrent ? '<span class="text-[8px] px-1 rounded bg-amber-500/30 text-amber-300 font-mono">YOU</span>' : ''}
                            </div>
                            <span class="text-[8px] text-slate-500">第 ${item.stage || 1} 關 • ${item.date || '剛剛'}</span>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <span class="font-black text-amber-400 font-mono text-xs">${item.score}</span>
                        <span class="text-[8px] text-slate-500 block leading-tight">PTS</span>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        /* ==========================================================
           11. INITIALIZATION
           ========================================================== */
        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById("headerPlayerName").innerText = playerName;
            document.getElementById("highScoreDisplay").innerText = highScore;
            buildArena();
            initCloudStorage();

            // 若尚未自訂過姓名（或為預設名稱），一進入遊戲即主動彈出輸入名字對話框
            const storedName = localStorage.getItem("demon_strike_player_name");
            if (!storedName) {
                setTimeout(() => {
                    openNameModal();
                }, 350);
            }
        });
    </script>
</body>
</html>

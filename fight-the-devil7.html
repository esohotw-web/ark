<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>打擊魔鬼街機挑戰 (Demon Strike Arcade)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for dynamic arcade SFX and Synth BGM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        arcade: {
                            bg: '#070a14',
                            surface: '#11172a',
                            border: '#1e293b',
                            red: '#ef4444',
                            accent: '#ff0055',
                            gold: '#fbbf24',
                            cyan: '#06b6d4',
                            green: '#10b981'
                        }
                    },
                    boxShadow: {
                        'neon-red': '0 0 15px rgba(239, 68, 68, 0.65)',
                        'neon-cyan': '0 0 15px rgba(6, 182, 212, 0.65)',
                        'neon-gold': '0 0 20px rgba(251, 191, 36, 0.8)',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Chakra Petch', 'Noto Sans TC', sans-serif;
            background-color: #070a14;
            overscroll-behavior: none;
        }

        /* Arcade cabinet screen scanlines */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Animations */
        .shaking {
            animation: shake 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 1px, 0); }
            20%, 80% { transform: translate3d(3px, -2px, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 2px, 0); }
            40%, 60% { transform: translate3d(4px, -1px, 0); }
        }

        @keyframes popUp {
            0% { transform: translateY(110%) scale(0.65); opacity: 0; }
            65% { transform: translateY(-8%) scale(1.05); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes whackHit {
            0% { transform: scale(1); }
            50% { transform: scale(0.7) rotate(12deg); filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }

        .animate-pop-up {
            animation: popUp 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-hit {
            animation: whackHit 0.16s ease-out forwards;
        }

        /* Custom scrollbar for leaderboard modal */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden text-slate-100 flex flex-col justify-between items-center bg-[#070a14] relative select-none">
    <!-- CRT scanlines overlay -->
    <div class="scanlines absolute inset-0 z-30 pointer-events-none"></div>

            <!-- SCORE & TIMER DASHBOARD -->

                    <span id="comboBadge" class="text-[9px] font-bold text-slate-500 transition-colors">連擊: 0x</span>

    <!-- JAVASCRIPT GAME LOGIC -->
    <script>
        /* ==========================================================
           1. GAME CONFIG & CONSTANTS
           ========================================================== */
        const TOTAL_HOLES = 12; // 3 columns x 4 rows
        const STAGE_DURATION = 30; // 30 seconds per stage
        const TOTAL_STAGES = 3;

        // Key mappings for desktop keyboards (3x4)
        // Row 1: 1, 2, 3 (or Q, W, E)
        // Row 2: 4, 5, 6 (or A, S, D)
        // Row 3: 7, 8, 9 (or Z, X, C)
        // Row 4: *, 0, # (or V, B, N)
        const KEY_MAP = {
            '1': 0, 'q': 0, 'Q': 0,
            '2': 1, 'w': 1, 'W': 1,
            '3': 2, 'e': 2, 'E': 2,
            '4': 3, 'a': 3, 'A': 3,
            '5': 4, 's': 4, 'S': 4,
            '6': 5, 'd': 5, 'D': 5,
            '7': 6, 'z': 6, 'Z': 6,
            '8': 7, 'x': 7, 'X': 7,
            '9': 8, 'c': 8, 'C': 8,
            '*': 9, 'v': 9, 'V': 9,
            '0': 10, 'b': 10, 'B': 10,
            '#': 11, 'n': 11, 'N': 11,
        };

        /* ==========================================================
           2. GAME STATE
           ========================================================== */
        let playerName = "獵魔者";
        let isPlaying = false;
        let isTransitioning = false;
        let isMuted = false;
        let currentStage = 1;
        let timeRemaining = STAGE_DURATION;
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let demonsHit = 0;
        let angelsHit = 0;
        let bestScore = 0;

        // Hole states: array of 12 elements
        // { type: null|'demon'|'gold_demon'|'angel', active: false, timer: null, warningTimer: null }
        let holes = [];

        // Timers
        let countdownTimer = null;
        let spawnerTimer = null;

        /* ==========================================================
           3. TONE.JS SOUND SYNTHESIZERS
           ========================================================== */
        let audioInitialized = false;
        let hitSynth, badSynth, goldSynth, warningSynth, bgmSynth, bgmLoop;

        function initAudio() {
            if (audioInitialized) return;
            try {
                Tone.start();

                // Hit Demon SFX (punchy arcade zap)
                hitSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 4,
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0.01, release: 0.2 }
                }).toDestination();

                // Gold Demon SFX (high chiming bell)
                goldSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.005, decay: 0.15, sustain: 0.1, release: 0.3 }
                }).toDestination();

                // Hit Angel penalty SFX (low buzzer)
                badSynth = new Tone.Synth({
                    oscillator: { type: 'sawtooth' },
                    envelope: { attack: 0.01, decay: 0.25, sustain: 0.05, release: 0.2 }
                }).toDestination();

                // Cue Warning SFX (subtle tick)
                warningSynth = new Tone.Synth({
                    oscillator: { type: 'square' },
                    envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.04 }
                }).toDestination();
                warningSynth.volume.value = -12;

                // Background 8-bit Bassline synth
                bgmSynth = new Tone.MonoSynth({
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.2, release: 0.2 },
                    filterEnvelope: { attack: 0.01, decay: 0.1, sustain: 0.4, release: 0.2, baseFrequency: 200, octaves: 2 }
                }).toDestination();
                bgmSynth.volume.value = -14;

                audioInitialized = true;
            } catch (e) {
                console.warn("Audio initialization bypassed or unsupported:", e);
            }
        }

        function playHitSound() {
            if (isMuted || !audioInitialized) return;
            try { hitSynth.triggerAttackRelease("C3", "8n"); } catch (e) {}
        }

        function playGoldSound() {
            if (isMuted || !audioInitialized) return;
            try {
                goldSynth.triggerAttackRelease(["E5", "G5", "C6"], "16n");
            } catch (e) {}
        }

        function playAngelHitSound() {
            if (isMuted || !audioInitialized) return;
            try { badSynth.triggerAttackRelease("F2", "8n"); } catch (e) {}
        }

        function playWarningBeep() {
            if (isMuted || !audioInitialized) return;
            try { warningSynth.triggerAttackRelease("C5", "32n"); } catch (e) {}
        }

        function playFanfare() {
            if (isMuted || !audioInitialized) return;
            try {
                const now = Tone.now();
                goldSynth.triggerAttackRelease("C5", "16n", now);
                goldSynth.triggerAttackRelease("E5", "16n", now + 0.1);
                goldSynth.triggerAttackRelease("G5", "16n", now + 0.2);
                goldSynth.triggerAttackRelease("C6", "8n", now + 0.3);
            } catch (e) {}
        }

        function startBgm(stage) {
            if (isMuted || !audioInitialized) return;
            try {
                stopBgm();
                const tempo = stage === 1 ? 130 : (stage === 2 ? 150 : 172);
                Tone.Transport.bpm.value = tempo;

                const notes = ["C2", "C2", "D#2", "F2", "G2", "G2", "F2", "D#2"];
                let step = 0;
                bgmLoop = new Tone.Loop(time => {
                    const note = notes[step % notes.length];
                    bgmSynth.triggerAttackRelease(note, "16n", time);
                    step++;
                }, "8n");

                bgmLoop.start(0);
                Tone.Transport.start();
            } catch (e) {}
        }

        function stopBgm() {
            try {
                if (bgmLoop) {
                    bgmLoop.stop();
                    bgmLoop.dispose();
                    bgmLoop = null;
                }
                Tone.Transport.stop();
            } catch (e) {}
        }

        function toggleMute() {
            isMuted = !isMuted;
            const icon = document.getElementById("soundIcon");
            if (isMuted) {
                icon.className = "fa-solid fa-volume-xmark text-xs text-rose-400";
                stopBgm();
            } else {
                icon.className = "fa-solid fa-volume-high text-xs text-slate-300";

        function validatePlayerName(name, showMessage = true) {
            const trimmed = name.trim();
            if (!trimmed) {
                if (showMessage) nameError.textContent = "名字不能為空！";
                if (showMessage) nameError.classList.remove("hidden");
                return false;
            }

            // Test if all Chinese
            const isAllChinese = /^[\u4e00-\u9fa5]+$/.test(trimmed);
            // Test if all English/numbers
            const isAllEnglish = /^[A-Za-z0-9\s]+$/.test(trimmed);

            if (isAllChinese && trimmed.length > 5) {
                if (showMessage) nameError.textContent = "純中文名字最多 5 個字！";
                if (showMessage) nameError.classList.remove("hidden");
                return false;
            }

            if (isAllEnglish && trimmed.length > 10) {
                if (showMessage) nameError.textContent = "純英文名字最多 10 個字母！";
                if (showMessage) nameError.classList.remove("hidden");
                return false;
            }

            if (trimmed.length > 15) {
                if (showMessage) nameError.textContent = "名字總長度最多 15 個字元！";
                if (showMessage) nameError.classList.remove("hidden");
                return false;
            }

            nameError.classList.add("hidden");
            return true;
        }

        function openNameModal() {
            nameInput.value = playerName === "獵魔者" ? "" : playerName;
            charCount.textContent = `${nameInput.value.length}/15`;
            nameError.classList.add("hidden");
            document.getElementById("nameModal").classList.remove("hidden");
        }

        function confirmPlayerName() {
            const val = nameInput.value.trim();

            playerName = val;

            document.getElementById("nameModal").classList.add("hidden");

        /* ==========================================================
           6. GAME LIFECYCLE & MECHANICS

        function handleStartButtonClick() {
            initAudio();
            if (isPlaying) {
                endGame();
            } else {
                startGame();
            }
        }

        function startGame() {
            isPlaying = true;
            isTransitioning = false;
            currentStage = 1;
            score = 0;
            combo = 0;
            maxCombo = 0;
            demonsHit = 0;
            angelsHit = 0;
            timeRemaining = STAGE_DURATION;

            updateDashboardUI();
            resetAllHoles();

            document.getElementById("startBtnText").textContent = "終止討伐 / STOP";
            document.getElementById("gameOverModal").classList.add("hidden");
            document.getElementById("stageTransitionOverlay").classList.add("hidden");

            startBgm(currentStage);
            runGameTimer();
            scheduleNextSpawns();
        }

        function runGameTimer() {
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                if (!isPlaying || isTransitioning) return;

                timeRemaining--;
                document.getElementById("timerDisplay").textContent = timeRemaining < 10 ? `0${timeRemaining}` : timeRemaining;
                const pct = (timeRemaining / STAGE_DURATION) * 100;
                document.getElementById("timeProgressBar").style.width = `${pct}%`;

                if (timeRemaining <= 0) {
                    if (currentStage < TOTAL_STAGES) {
                        advanceToNextStage();
                    } else {
                        endGame();
                    }
                }
            }, 1000);
        }

        function advanceToNextStage() {
            isTransitioning = true;
            resetAllHoles();
            stopBgm();
            playFanfare();

            currentStage++;
            const overlay = document.getElementById("stageTransitionOverlay");
            const transTitle = document.getElementById("transStageTitle");
            const transDesc = document.getElementById("transStageDesc");
            const countdownEl = document.getElementById("transCountdown");

            if (currentStage === 2) {
                transTitle.textContent = "進入第 2 關";
                transDesc.textContent = "難度升級！雙目標同時或接續竄出，手速要快！";
            } else if (currentStage === 3) {
                transTitle.textContent = "🔥 第 3 關：地獄降臨";
                transDesc.textContent = "極限考驗！場上將有 3 隻魔鬼/天使同步或狂暴連發！";
            }

            overlay.classList.remove("hidden");
            let transLeft = 3;
            countdownEl.textContent = transLeft;

            const tInterval = setInterval(() => {
                transLeft--;
                if (transLeft > 0) {
                    countdownEl.textContent = transLeft;
                } else {
                    clearInterval(tInterval);
                    overlay.classList.add("hidden");
                    isTransitioning = false;
                    timeRemaining = STAGE_DURATION;
                    updateDashboardUI();
                    startBgm(currentStage);
                    scheduleNextSpawns();
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            isTransitioning = false;
            clearInterval(countdownTimer);
            clearTimeout(spawnerTimer);
            resetAllHoles();
            stopBgm();

            if (score > bestScore) {
                bestScore = score;
                document.getElementById("highScoreDisplay").textContent = bestScore;
            }

            document.getElementById("startBtnText").textContent = "投幣啟動 / START";

            // Save score to local leaderboard
            saveScoreRecord();

            // Populate game over modal
            document.getElementById("finalScoreVal").textContent = score;
            document.getElementById("finalComboVal").textContent = `${maxCombo}x`;
            document.getElementById("finalDemonsVal").textContent = `${demonsHit} 隻`;
            document.getElementById("finalAngelsVal").textContent = `${angelsHit} 次`;

            let rank = "獵魔菜鳥";
            if (score >= 4000) rank = "👑 傳奇大天使長";
            else if (score >= 2800) rank = "⚔️ 地獄終結者";
            else if (score >= 1800) rank = "🔥 狂暴行刑官";
            else if (score >= 1000) rank = "⚡ 熟練獵魔師";
            document.getElementById("summaryRankTitle").textContent = rank;

            document.getElementById("gameOverModal").classList.remove("hidden");
        }

        function restartGame() {
            document.getElementById("gameOverModal").classList.add("hidden");
            startGame();
        }

        function resetAllHoles() {
            for (let i = 0; i < TOTAL_HOLES; i++) {
                clearTimeout(holes[i].timer);
                clearTimeout(holes[i].warningTimer);
                holes[i].type = null;
                holes[i].active = false;

                const led = document.getElementById(`led-${i}`);
                const target = document.getElementById(`target-${i}`);
                if (led) {
                    led.className = "absolute top-1 w-2.5 h-2.5 rounded-full bg-slate-800 transition-all duration-150 z-20 border border-slate-700/60";
                }
                if (target) {
                    target.innerHTML = "";
                    target.className = "w-full h-full flex items-center justify-center translate-y-[120%] pointer-events-none transition-transform z-10";
                }
            }
        }

        /* ==========================================================
           7. TARGET SPAWNING LOGIC (Stage 1, 2, 3)
           ========================================================== */
        function scheduleNextSpawns() {
            if (!isPlaying || isTransitioning) return;

            // Spawning parameters by stage
            let countToSpawn = 1;
            let delayBetweenSpawns = 900;

            if (currentStage === 1) {
                countToSpawn = 1;
                // Gradually speed up as time ticks down
                const progress = (STAGE_DURATION - timeRemaining) / STAGE_DURATION;
                delayBetweenSpawns = 1100 - (progress * 400); // 1100ms down to 700ms
            } else if (currentStage === 2) {
                // Stage 2: 1 to 2 creatures
                countToSpawn = Math.random() < 0.65 ? 2 : 1;
                delayBetweenSpawns = 800 - Math.random() * 200; // 600ms - 800ms
            } else if (currentStage === 3) {
                // Stage 3: 2 to 3 creatures
                const r = Math.random();
                countToSpawn = r < 0.5 ? 3 : 2;
                delayBetweenSpawns = 650 - Math.random() * 200; // 450ms - 650ms
            }

            // Find available holes
            const availableHoles = [];
            for (let i = 0; i < TOTAL_HOLES; i++) {
                if (!holes[i].active) availableHoles.push(i);
            }

            // Shuffle available holes
            availableHoles.sort(() => Math.random() - 0.5);

            const chosen = availableHoles.slice(0, Math.min(countToSpawn, availableHoles.length));

            chosen.forEach((holeIndex, idx) => {
                // Random stagger if asynchronous
                const staggerDelay = idx * (Math.random() < 0.4 ? 180 : 0);
                setTimeout(() => {
                    if (isPlaying && !isTransitioning) spawnCreature(holeIndex);
                }, staggerDelay);
            });

            spawnerTimer = setTimeout(scheduleNextSpawns, delayBetweenSpawns);
        }

        function spawnCreature(index) {
            if (!holes[index] || holes[index].active) return;

            holes[index].active = true;

            // Determine creature type
            // 68% Demon, 14% Gold Demon, 18% Angel
            const roll = Math.random();
            let type = 'demon';
            if (roll > 0.82) type = 'angel';
            else if (roll > 0.68) type = 'gold_demon';

            holes[index].type = type;

            const led = document.getElementById(`led-${index}`);
            const target = document.getElementById(`target-${index}`);

            // 1. Cue/Warning phase: flash LED for 220ms
            if (type === 'angel') {
                led.className = "absolute top-1 w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-neon-cyan animate-ping z-20";
            } else if (type === 'gold_demon') {
                led.className = "absolute top-1 w-2.5 h-2.5 rounded-full bg-amber-400 shadow-neon-gold animate-ping z-20";
            } else {
                led.className = "absolute top-1 w-2.5 h-2.5 rounded-full bg-red-500 shadow-neon-red animate-ping z-20";
            }
            playWarningBeep();

            // 2. Creature pop up
            holes[index].warningTimer = setTimeout(() => {
                if (!holes[index].active) return;

                // Stop blinking led, keep glow
                if (type === 'angel') {
                    led.className = "absolute top-1 w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-neon-cyan z-20";
                    target.innerHTML = angelSvg;
                } else if (type === 'gold_demon') {
                    led.className = "absolute top-1 w-2.5 h-2.5 rounded-full bg-amber-400 shadow-neon-gold z-20";
                    target.innerHTML = goldDemonSvg;
                } else {
                    led.className = "absolute top-1 w-2.5 h-2.5 rounded-full bg-red-500 shadow-neon-red z-20";
                    target.innerHTML = demonSvg;
                }

                target.className = "w-full h-full flex items-center justify-center animate-pop-up z-10";

                // Stay on screen duration based on stage
                let stayDuration = 1000;
                if (currentStage === 1) stayDuration = 1100;
                else if (currentStage === 2) stayDuration = 850;
                else if (currentStage === 3) stayDuration = 700;

                holes[index].timer = setTimeout(() => {
                    hideHoleCreature(index);
                }, stayDuration);

            }, 200);
        }

        function hideHoleCreature(index) {
            const h = holes[index];
            if (!h) return;

            clearTimeout(h.timer);
            clearTimeout(h.warningTimer);
            h.active = false;
            h.type = null;

            const led = document.getElementById(`led-${index}`);
            const target = document.getElementById(`target-${index}`);

            if (led) {
                led.className = "absolute top-1 w-2.5 h-2.5 rounded-full bg-slate-800 transition-all duration-150 z-20 border border-slate-700/60";
            }
            if (target) {
                target.className = "w-full h-full flex items-center justify-center translate-y-[120%] transition-transform duration-150 z-10";
                setTimeout(() => {
                    if (!h.active) target.innerHTML = "";
                }, 150);
            }
        }

        /* ==========================================================
           8. WHACK / HIT RESOLUTION
           ========================================================== */
        function whackHole(index) {
            if (!isPlaying || isTransitioning) return;

            const h = holes[index];
            const holeEl = document.getElementById(`hole-${index}`);
            const target = document.getElementById(`target-${index}`);
            const pop = document.getElementById(`pop-${index}`);

            // Small tactile vibration on mobile
            if (navigator.vibrate) navigator.vibrate(25);

            if (h.active && h.type) {
                const currentType = h.type;
                clearTimeout(h.timer);
                clearTimeout(h.warningTimer);
                h.active = false;
                h.type = null;

                target.classList.remove('animate-pop-up');
                target.classList.add('animate-hit');

                if (currentType === 'demon') {
                    demonsHit++;
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;

                    const comboBonus = Math.min(combo * 10, 100);
                    const pts = 100 + comboBonus;
                    score += pts;

                    playHitSound();
                    showFloatingText(pop, `+${pts}`, 'text-amber-400');
                } else if (currentType === 'gold_demon') {
                    demonsHit++;
                    combo += 2;
                    if (combo > maxCombo) maxCombo = combo;

                    const pts = 250;
                    score += pts;

                    playGoldSound();
                    showFloatingText(pop, `+${pts} 爆擊!`, 'text-yellow-300 font-extrabold');
                } else if (currentType === 'angel') {
                    angelsHit++;
                    combo = 0; // reset combo
                    score = Math.max(0, score - 150);

                    playAngelHitSound();
                    holeEl.classList.add('shaking');
                    setTimeout(() => holeEl.classList.remove('shaking'), 250);
                    showFloatingText(pop, `-150 誤傷!`, 'text-cyan-300');
                }

                // Reset hole DOM after hit animation
                setTimeout(() => {
                    hideHoleCreature(index);
                }, 160);
            } else {
                // Empty hit: slight combo break penalty
                if (combo > 2) combo = Math.floor(combo / 2);
            }

            updateDashboardUI();
        }

        /* ==========================================================
           10. LEADERBOARD SYSTEM (CROSS-DEVICE CLOUD STORAGE)
           ========================================================== */
        // Default initial mockup fallback
        let leaderboardData = [
            { name: "路西法獵人", score: 3820, stage: 3, date: "今日" },
            { name: "神槌小美", score: 2950, stage: 2, date: "昨日" },
            { name: "聖光遊俠", score: 2410, stage: 2, date: "3天前" },
            { name: "街機之王", score: 1800, stage: 1, date: "5天前" }
        ];

        // Unique Cloud Key tied to this game for GitHub Pages
        const CLOUD_STORAGE_KEY = "demon_whacker_gh_scores_v1";
        // Free open KV endpoint for GitHub Pages cross-device sharing
        const CLOUD_API_URL = "https://api.restful-api.dev/objects";
        let cloudRecordId = localStorage.getItem("demon_strike_cloud_obj_id") || null;

        async function initCloudStorage() {
            updateSyncBadge("同步中...", "text-amber-400 bg-amber-950 border-amber-800");
            try {
                // First attempt to read from local backup
                const localBackup = localStorage.getItem(CLOUD_STORAGE_KEY);
                if (localBackup) {
                    try {
                        const parsed = JSON.parse(localBackup);
                        if (Array.isArray(parsed) && parsed.length > 0) leaderboardData = parsed;
                    } catch(e) {}
                }

                // If we have an existing cloud ID, fetch it
                if (cloudRecordId) {
                    const res = await fetch(`${CLOUD_API_URL}/${cloudRecordId}`);
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.data && Array.isArray(json.data.scores)) {
                            leaderboardData = mergeAndSortScores(leaderboardData, json.data.scores);
                            localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(leaderboardData));
                            updateSyncBadge("雲端已連線", "text-emerald-400 bg-emerald-950 border-emerald-800");
                            return;
                        }
                    }
                }

                // Query existing public shared board
                const queryRes = await fetch(`${CLOUD_API_URL}`);
                if (queryRes.ok) {
                    const allObjs = await queryRes.json();
                    const found = Array.isArray(allObjs) ? allObjs.find(o => o.name === CLOUD_STORAGE_KEY) : null;
                    if (found && found.data && Array.isArray(found.data.scores)) {
                        cloudRecordId = found.id;
                        localStorage.setItem("demon_strike_cloud_obj_id", found.id);
                        leaderboardData = mergeAndSortScores(leaderboardData, found.data.scores);
                        localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(leaderboardData));
                        updateSyncBadge("雲端已連線", "text-emerald-400 bg-emerald-950 border-emerald-800");
                        return;
                    }
                }

                // If not found, create a new shared record
                const createRes = await fetch(CLOUD_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: CLOUD_STORAGE_KEY,
                        data: { scores: leaderboardData }
                    })
                });

                if (createRes.ok) {
                    const created = await createRes.json();
                    cloudRecordId = created.id;
                    localStorage.setItem("demon_strike_cloud_obj_id", created.id);
                    updateSyncBadge("雲端已連線", "text-emerald-400 bg-emerald-950 border-emerald-800");
                }
            } catch (err) {
                console.warn("Cloud leaderboard sync notice (using local offline storage):", err);
                updateSyncBadge("離線模式", "text-slate-400 bg-slate-900 border-slate-700");
            }
        }

        function mergeAndSortScores(listA, listB) {
            const combined = [...(listA || []), ...(listB || [])];
            // Deduplicate matching name + score + stage
            const unique = [];
            const seen = new Set();
            for (const item of combined) {
                const key = `${item.name}-${item.score}-${item.stage}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(item);
                }
            }
            unique.sort((a, b) => b.score - a.score);
            return unique.slice(0, 30);
        }

        function updateSyncBadge(text, classStyle) {
            const badge = document.getElementById("syncStatusBadge");
            if (!badge) return;
            badge.className = `text-[9px] px-1.5 py-0.5 rounded border flex items-center gap-1 ${classStyle}`;
            badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-current animate-pulse"></span> ${text}`;
        }

        async function saveScoreRecord() {
            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            const newEntry = {
                name: playerName,
                score: score,
                stage: currentStage,
                date: dateStr,
                timestamp: Date.now()
            };

            // 1. Immediately update locally
            leaderboardData.push(newEntry);
            leaderboardData = mergeAndSortScores(leaderboardData, []);
            localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(leaderboardData));

            // 2. Broadcast to cloud
            try {
                if (cloudRecordId) {
                    updateSyncBadge("上傳中...", "text-amber-400 bg-amber-950 border-amber-800");
                    const res = await fetch(`${CLOUD_API_URL}/${cloudRecordId}`);
                    let currentRemote = [];
                    if (res.ok) {
                        const json = await res.json();
                        currentRemote = json?.data?.scores || [];
                    }
                    const updatedScores = mergeAndSortScores(currentRemote, [newEntry]);
                    leaderboardData = updatedScores;
                    localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(leaderboardData));

                    await fetch(`${CLOUD_API_URL}/${cloudRecordId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: CLOUD_STORAGE_KEY,
                            data: { scores: updatedScores }
                        })
                    });
                    updateSyncBadge("成績已同步", "text-emerald-400 bg-emerald-950 border-emerald-800");
                }
            } catch (e) {
                console.warn("Failed to push score to cloud:", e);
                updateSyncBadge("離線已儲存", "text-slate-400 bg-slate-900 border-slate-700");
            }
        }

        async function fetchOnlineLeaderboard(showLoading = false) {
            if (showLoading) {
                updateSyncBadge("讀取中...", "text-amber-400 bg-amber-950 border-amber-800");
            }
            try {
                if (!cloudRecordId) {
                    await initCloudStorage();
                } else {
                    const res = await fetch(`${CLOUD_API_URL}/${cloudRecordId}`);
                    if (res.ok) {
                        const json = await res.json();
                        if (json?.data?.scores) {
                            leaderboardData = mergeAndSortScores(leaderboardData, json.data.scores);
                            localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(leaderboardData));
                        }
                    }
                }
                updateSyncBadge("雲端已連線", "text-emerald-400 bg-emerald-950 border-emerald-800");
            } catch (e) {
                console.warn("Could not refresh remote board:", e);
                updateSyncBadge("離線快取", "text-slate-400 bg-slate-900 border-slate-700");
            }
            renderLeaderboard();
        }

        function openLeaderboard() {
            renderLeaderboard();
            document.getElementById("leaderboardModal").classList.remove("hidden");
            // Auto fetch fresh data in background
            fetchOnlineLeaderboard(false);
        }

        function closeLeaderboard() {
            document.getElementById("leaderboardModal").classList.add("hidden");
        }

        function renderLeaderboard() {
            const list = document.getElementById("leaderboardList");
            list.innerHTML = "";

            if (!leaderboardData || leaderboardData.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">目前暫無紀錄，快成為第一位勇者！</div>`;
                return;
            }

            leaderboardData.forEach((item, index) => {
                const row = document.createElement("div");
                const isCurrent = item.name === playerName && item.score === score;

                let rankBadge = `<span class="w-5 text-center font-bold text-slate-500">${index + 1}</span>`;
                if (index === 0) rankBadge = `<span class="w-5 text-center text-amber-400 font-extrabold text-sm">🥇</span>`;
                else if (index === 1) rankBadge = `<span class="w-5 text-center text-slate-300 font-extrabold text-sm">🥈</span>`;
                else if (index === 2) rankBadge = `<span class="w-5 text-center text-amber-600 font-extrabold text-sm">🥉</span>`;

                row.className = `flex items-center justify-between p-2 rounded-lg border ${
                    isCurrent ? 'bg-amber-500/15 border-amber-500/50 text-amber-200 shadow-sm' : 'bg-slate-950/60 border-slate-800 text-slate-300'
                }`;

                row.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        ${rankBadge}
                        <div class="flex flex-col min-w-0">
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold truncate max-w-[110px] text-xs">${item.name}</span>
                                ${isCurrent ? '<span class="text-[9px] px-1 rounded bg-amber-500/30 text-amber-300 font-mono">YOU</span>' : ''}
                            </div>
                            <span class="text-[9px] text-slate-400">第 ${item.stage || 1} 關 • ${item.date || '剛剛'}</span>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <span class="font-black text-amber-400 font-mono text-sm">${item.score}</span>
                        <span class="text-[9px] text-slate-500 block leading-tight">PTS</span>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        /* ==========================================================
           11. INIT ON WINDOW LOAD
           ========================================================== */
        window.addEventListener("DOMContentLoaded", () => {
            buildArena();
            // Automatically prompt player name dialog at first launch
            openNameModal();
            // Initiate cross-device cloud leaderboard sync
            initCloudStorage();
        });
    </script>
</body>
</html>
